function inline(s){
  var h=esc(s);
  h=h.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,function(m,t,u){
    var raw=u.replace(/&amp;/g,'&'),ok='',x;
    if(safeUrl(raw))ok=safeUrl(raw);
    else if((x=/^page:([\w-]+)$/.exec(raw)))ok=U('page',x[1]);
    else if((x=/^article:([\w-]+)$/.exec(raw)))ok=U('post',x[1]);
    else if(/^(#[\w\/:%-]*|[\w-]+\.html|mailto:[^\s]+|tel:\+?\d+)$/.test(raw))ok=raw;
    if(!ok)return m;
    return '<a href="'+esc(ok)+'"'+(/^https?:/.test(ok)?' target="_blank" rel="noopener noreferrer"':'')+'>'+t+'</a>';
  });
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\*)/g,'$1<em>$2</em>');
  return h;
}
/* Prix : le bloc « Formulaire de devis » (page Commander) est la référence unique.
   {{prix_3}} = 250 000 · {{prix_fcfa_3}} = 250 000 FCFA (ou « / mois » si mensuel) · {{prix_court_3}} = 250 000 (ou « 250 000 / mois »)
   Le chiffre est le numéro du projet (1 = première ligne du formulaire de devis). */
function priceTokens(){
  var src=(typeof work!=='undefined'&&work&&work.pages)?work:DATA,qb=null,m={remise_comptant:String(Q_CASH_LOW),remise_comptant_haut:String(Q_CASH_HIGH),seuil_remise:qFmt(Q_CASH_FROM)};
  (src.pages||[]).some(function(p){return (p.blocks||[]).some(function(x){if(x.type==='quote'){qb=x;return true;}return false;});});
  if(!qb)return m;
  m.nb_projets=String(qProjects(qb).length);
  qProjects(qb).forEach(function(p){
    var n=p.custom?p.priceText:qFmt(p.price);
    m['prix_'+p.i]=n;
    m['prix_fcfa_'+p.i]=p.custom?p.priceText:n+' FCFA'+(p.monthly?' / mois':'');
    m['prix_court_'+p.i]=p.custom?p.priceText:n+(p.monthly?' / mois':'');
  });
  return m;
}
function tok(s){
  var st=DATA.settings,m=Object.assign(priceTokens(),{name:st.name,full:st.full,phone:st.phone,email:st.email,website:st.website,url:st.siteUrl});
  return String(s==null?'':s).replace(/\{\{(\w+)\}\}/g,function(x,k){return m[k]!=null&&m[k]!==''?m[k]:x;});
}
function md(t){
  var out=[],list=[],ord=[];
  function flush(){
    if(list.length){out.push('<ul>'+list.map(function(x){return '<li>'+inline(x)+'</li>';}).join('')+'</ul>');list=[];}
    if(ord.length){out.push('<ol>'+ord.map(function(x){return '<li>'+inline(x)+'</li>';}).join('')+'</ol>');ord=[];}
  }
  tok(t).split('\n').forEach(function(line){
    var l=line.trim(),m;
    if(!l){flush();return;}
    if(l.indexOf('## ')===0){flush();out.push('<h3>'+inline(l.slice(3))+'</h3>');}
    else if(l.indexOf('- ')===0){if(ord.length)flush();list.push(l.slice(2));}
    else if((m=/^\d+\.\s+(.*)$/.exec(l))){if(list.length)flush();ord.push(m[1]);}
    else if(l.indexOf('> ')===0){flush();out.push('<blockquote class="quote">'+inline(l.slice(2))+'</blockquote>');}
    else if((m=/^!\[([^\]]*)\]\(([^)\s]+)\)$/.exec(l))){
      flush();
      var src=m[2].indexOf('media:')===0?RES(m[2]):(/^(https:\/\/|assets\/)/.test(m[2])?m[2]:'');
      if(src)out.push('<figure class="fig"><img src="'+esc(src)+'" alt="'+esc(m[1])+'" loading="lazy">'+(m[1]?'<figcaption>'+esc(m[1])+'</figcaption>':'')+'</figure>');
    }
    else{flush();out.push('<p>'+inline(l)+'</p>');}
  });
  flush();return out.join('');
}

function safeUrl(u){u=String(u||'').trim();if(/^www\./i.test(u))u='https://'+u;return /^https?:\/\//i.test(u)?u:'';}
function safeHttps(u){u=String(u||'').trim();return /^https:\/\//i.test(u)?u:'';}
function validEmail(e){return /^[^\s@]+@[a-z0-9]([a-z0-9.-]*[a-z0-9])?\.[a-z]{2,}$/i.test(String(e||'').trim());}

function mediaName(v){var id=String(v||'').slice(6),m=mediaList().find(function(x){return x.id===id;});return m?m.name:'';}
function h53(str){var h1=0xdeadbeef,h2=0x41c6ce57;for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);}
function fdt(iso){try{return new Date(iso).toLocaleString('fr-FR',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return iso;}}
function lum(hex){var n=parseInt(String(hex).slice(1),16);return (0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))/255;}
function blockText(b){
  var o=[];
  Object.keys(b).forEach(function(k){
    var v=b[k];
    if(k==='id'||k==='type'||k==='code')return;
    if(typeof v==='string'){if(v.indexOf('data:')!==0&&v.indexOf('media:')!==0&&v.indexOf('page:')!==0)o.push(v);}
    else if(Array.isArray(v))v.forEach(function(i){if(i&&typeof i==='object')o.push((i.title||'')+' '+(i.text||'')+' '+(i.extra||''));});
  });

}

function safeCss(c){return String(c||'').replace(/<\/?style[^>]*>/gi,'').replace(/<\//g,'<\\/');}
function fileFor(kind,slug){
  if(kind==='blog')return 'blog.html';
  if(kind==='search')return 'recherche.html';
  if(kind==='post')return 'article-'+slug+'.html';
  return (!slug||slug==='accueil')?'index.html':slug+'.html';
}
function hashFor(kind,slug){return kind==='search'?'#recherche':kind==='blog'?'#blog':kind==='post'?'#article-'+slug:'#'+(slug||'accueil');}
function U(kind,slug){return STATIC?fileFor(kind,slug):hashFor(kind,slug);}
function href(t){
  t=String(t||'');
  if(t.indexOf('page:')===0&&t.indexOf('?')>0){var qq=t.slice(5),qi=qq.indexOf('?');return U('page',qq.slice(0,qi)||'accueil')+qq.slice(qi);}
  if(t==='blog')return U('blog');
  if(isExt(t))return safeUrl(t.slice(4))||U('page','accueil');
  if(t.indexOf('page:')===0)return U('page',t.slice(5)||'accueil');
  return U('page','accueil');
}
function linkAttrs(t){return isExt(t)?' target="_blank" rel="noopener noreferrer"':'';}
function route(){
  if(STATIC){
    var m=document.querySelector('meta[name="gsc-route"]').getAttribute('content').split(':');
    if(m[0]==='blog')return {k:'blog'};
    if(m[0]==='post')return {k:'post',slug:m[1]};
    if(m[0]==='notfound')return {k:'nf'};
    if(m[0]==='search'){var q0='';try{q0=new URLSearchParams(location.search).get('q')||'';}catch(e){}return {k:'search',q:q0};}
    try{QPRE=parseInt(new URLSearchParams(location.search).get('p'),10)||0;}catch(e){QPRE=0;}
    return {k:'page',slug:m[1]||'accueil'};
  }
  var h=(location.hash||'').slice(1);
  if(h.indexOf('admin')===0)return {k:'admin',tab:h.slice(6)||'tableau'};
  if(h==='blog')return {k:'blog'};
  if(h.indexOf('recherche')===0){var q1='';try{q1=decodeURIComponent((h.split(':')[1]||'').replace(/\+/g,' '));}catch(e){}return {k:'search',q:q1};}
  if(h.indexOf('article-')===0)return {k:'post',slug:h.slice(8)};
  var hq=h.indexOf('?');QPRE=hq>0?(parseInt((h.slice(hq).match(/[?&]p=(\d+)/)||[])[1],10)||0):0;
  return {k:'page',slug:(hq>0?h.slice(0,hq):h)||'accueil'};
}
function selfHref(r){
  if(r.k==='blog'||r.k==='post')return U('blog');
  if(r.k==='page')return U('page',r.slug);

}
function pageUrl(kind,slug){

  if(STATIC)return base?base+'/'+(fileFor(kind,slug)==='index.html'?'':fileFor(kind,slug)):(BUILDING?'':location.href);
  return location.href.split('#')[0]+hashFor(kind,slug);
}

function metaFor(r){
  var st=DATA.settings,nm=st.name,title=nm,desc=st.description||'',kind='website',file='',noindex=false;
  if(r.k==='page'){
    var p=DATA.pages.find(function(x){return x.slug===r.slug;});
    if(p){title=p.seoTitle||((r.slug==='accueil')?nm+' — '+(st.full||''):p.title+' — '+nm);desc=p.desc||desc;noindex=!!p.noindex;}
    file=fileFor('page',r.slug);
  }else if(r.k==='blog'){
    title='Blog — '+nm;desc='Conseils pratiques tirés de la méthode GSC pour lancer, structurer et développer votre entreprise.';file='blog.html';
  }else if(r.k==='post'){
    var a=DATA.posts.find(function(x){return x.slug===r.slug;});
    if(a){title=a.seoTitle||(a.title+' — '+nm);desc=a.excerpt||desc;kind='article';noindex=!!a.noindex;}
    file='article-'+r.slug+'.html';
  }else if(r.k==='search'){title='Recherche — '+nm;noindex=true;file='recherche.html';}
  else if(r.k==='admin'){title='Administration — '+nm;noindex=true;}
  else if(r.k==='nf'){title='Page introuvable — '+nm;file='404.html';noindex=true;}
  if(st.maintenance)noindex=true;
  return {title:tok(title),desc:tok(desc),kind:kind,file:file,noindex:noindex};
}
function applyMeta(r){
  var m=metaFor(r);
  document.title=m.title;
  var d=document.querySelector('meta[name="description"]');
  if(!d){d=document.createElement('meta');d.setAttribute('name','description');document.head.appendChild(d);}
  d.setAttribute('content',m.desc);
  var rb=document.querySelector('meta[name="robots"]');
  if(m.noindex){
    if(!rb){rb=document.createElement('meta');rb.setAttribute('name','robots');rb.setAttribute('data-dyn','1');document.head.appendChild(rb);}
    rb.setAttribute('content','noindex');
  }else if(rb&&rb.getAttribute('data-dyn'))rb.remove();
}
function crumbsFor(r){
  var h={t:'Accueil',k:'page',s:'accueil'};

}

function jsonld(r,site){
  var st=DATA.settings,out=[];
  if(!site)return out;
  var logo=st.logoL||'';
  var sameAs=[st.tiktok,st.facebook,st.linkedin].map(safeUrl).filter(Boolean);
  if(r.k==='page'&&r.slug==='accueil'){
    var org={'@context':'https://schema.org','@type':'Organization','name':st.name,'alternateName':st.full,'url':site+'/','description':tok(st.description||'')};
    if(logo)org.logo=site+'/'+logo;
    if(st.phone)org.telephone=st.phone;
    if(validEmail(st.email))org.email=st.email;
    if(sameAs.length)org.sameAs=sameAs;
    out.push(org);
  }
  if(r.k==='post'){
    var a=DATA.posts.find(function(x){return x.slug===r.slug;});
    if(a)out.push({'@context':'https://schema.org','@type':'Article','headline':a.title,'datePublished':a.date,'dateModified':a.date,'description':a.excerpt,'inLanguage':'fr','author':{'@type':'Person','name':a.author||st.name},'publisher':{'@type':'Organization','name':st.name},'mainEntityOfPage':site+'/'+fileFor('post',a.slug)});
  }
  if(r.k==='page'){
    var p=DATA.pages.find(function(x){return x.slug===r.slug;});
    var faq=p&&p.blocks.filter(function(b){return b.type==='faq'&&(b.items||[]).length;})[0];
    if(faq)out.push({'@context':'https://schema.org','@type':'FAQPage','mainEntity':faq.items.map(function(i){return {'@type':'Question','name':i.title,'acceptedAnswer':{'@type':'Answer','text':i.text}};})});
  }
  var c=crumbsFor(r);
  if(c.length)out.push({'@context':'https://schema.org','@type':'BreadcrumbList','itemListElement':c.map(function(x,i){var f=fileFor(x.k,x.s);return {'@type':'ListItem','position':i+1,'name':x.t,'item':site+'/'+(f==='index.html'?'':f)};})});
  return out;
}

      .then(function(r){if(!r.ok)throw new Error('http');return r.json();}).then(function(j){if(!j||j.status!=='ok')throw new Error('srv');f.reset();quoteUpdate(f);show('ok','Merci, votre commande est bien envoyée. Nous vous contactons très vite pour confirmer et lancer votre projet.');})
      .catch(function(){fallback('L’envoi automatique a échoué. Envoyez votre commande autrement :');});

function getObj(ref){
  var a=String(ref||'').split(':'),k=a[0];

  if(k==='p')return work.pages.find(function(x){return x.id===a[1];});
  if(k==='b'){var p=work.pages.find(function(x){return x.id===a[1];});return p&&p.blocks.find(function(x){return x.id===a[2];});}
  if(k==='x')return work.posts.find(function(x){return x.id===a[1];});
  if(k==='m')return work.menu.find(function(x){return x.id===a[1];});
  if(k==='t')return work.steps.find(function(x){return String(x.n)===a[1];});
  if(k==='r')return work.redirects.find(function(x){return x.id===a[1];});

function mv(arr,i,d){var j=i+d;if(j<0||j>=arr.length)return;var t=arr[i];arr[i]=arr[j];arr[j]=t;}
function walkStr(o,fn){
  var SKIP={id:1,type:1,slug:1,date:1,status:1,target:1,cta1t:1,cta2t:1,parent:1,mode:1,size:1,bg:1,image:1,cover:1,siteUrl:1,formEndpoint:1,accent:1,accentColor:1,brandColor:1,font:1};
  function ok(v){return v.indexOf('data:')!==0&&v.indexOf('media:')!==0&&v.indexOf('page:')!==0&&v.indexOf('url:')!==0;}
  if(Array.isArray(o)){o.forEach(function(v,i){if(typeof v==='string'){if(ok(v))o[i]=fn(v);}else if(v&&typeof v==='object')walkStr(v,fn);});}
  else if(o&&typeof o==='object'){Object.keys(o).forEach(function(k){var v=o[k];if(typeof v==='string'){if(!SKIP[k]&&ok(v))o[k]=fn(v);}else if(v&&typeof v==='object')walkStr(v,fn);});}
}

function healthChecks(d){
  var s=d.settings,out=[];
  function add(ok,label,hint,opt){out.push({ok:ok,label:label,hint:hint,opt:!!opt});}
  var pi=phoneIssue(s.phone);
  add(!!safeUrl(s.siteUrl),'Adresse du site renseignée','Nécessaire pour sitemap.xml, les liens canoniques et le partage. Réglages, bloc Référencement.');
  add(validEmail(s.email),'Adresse e-mail valide','Un nom de domaine ne peut pas contenir de tiret bas (_). Réglages, bloc Coordonnées.');
  add(!pi,'Numéro de téléphone complet',pi==='incomplet'?'Un numéro sénégalais compte 9 chiffres après +221.':'Ajoutez un numéro dans Réglages.');
  add(!!digits(s.whatsapp),'Numéro WhatsApp renseigné','Il permet d’envoyer les demandes du formulaire par WhatsApp. Format : 221 suivi de 9 chiffres.');
  add(!!safeHttps(s.formEndpoint),'Formulaire relié à un service de réception','Sans service, le visiteur choisit WhatsApp ou e-mail à la fin du formulaire. Réglages, bloc Contact.',true);
  var dl=(s.description||'').length;
  add(dl>=70&&dl<=170,'Description du site pour Google (70 à 160 caractères)','Actuellement '+dl+' caractères. Réglages, bloc Référencement.');
  var nd=d.pages.filter(function(p){return p.status==='publié'&&!p.desc;}).length;
  add(nd===0,'Chaque page publiée a sa description',nd+' page(s) sans description. Elle s’écrit dans l’éditeur de page.');
  var lg=d.pages.filter(function(p){return p.legal;});
  var todo=lg.filter(function(p){return JSON.stringify(p.blocks).indexOf('[à compléter]')>-1;}).length;
  add(lg.length>0&&todo===0&&lg.every(function(p){return p.status==='publié';}),'Pages légales complétées et publiées','Mentions légales et confidentialité : remplacez chaque « [à compléter] » par vos informations réelles, puis faites valider le texte par un juriste.');
  add(!s.maintenance,'Mode maintenance désactivé','Le site est actuellement masqué aux visiteurs. Apparence, bloc Maintenance.');
  add(!!s.logoL,'Logo présent','Ajoutez-le dans Réglages.');
  add(!!safeUrl(s.linkedin),'Lien LinkedIn renseigné','Optionnel.',true);
  add(!!safeUrl(s.bookingUrl),'Lien de prise de rendez-vous (Calendly ou autre)','Optionnel : il remplace le bouton « Diagnostic gratuit » de l’en-tête.',true);
  return out;
}
function checksHtml(d){
  return '<ul class="check">'+healthChecks(d).map(function(c){
    return '<li><span class="pill'+(c.ok?' ok':c.opt?'':' warn')+'">'+(c.ok?'OK':c.opt?'Option':'À faire')+'</span><span><strong>'+esc(c.label)+'</strong>'+(c.ok?'':'<br><small style="color:var(--muted)">'+esc(c.hint)+'</small>')+'</span></li>';
  }).join('')+'</ul>';
}
function contentIssues(d){
  var out=[],pubSlugs={},allSlugs={};
  d.pages.forEach(function(p){allSlugs[p.slug]=p;if(p.status==='publié')pubSlugs[p.slug]=1;});
  function chkT(t,where){
    t=String(t||'');
    if(t.indexOf('page:')===0){var sl=t.slice(5);if(!allSlugs[sl])out.push({sev:'bad',text:where+' : la page « '+sl+' » n’existe plus.'});else if(!pubSlugs[sl])out.push({sev:'bad',text:where+' : la page « '+allSlugs[sl].title+' » est en brouillon, le lien mène à une erreur.'});}
  }
  d.menu.forEach(function(m){chkT(m.target,'Menu « '+m.label+' »');});
  (function(){
    var PT=priceTokens();
    d.pages.forEach(function(p){
      var raw=JSON.stringify(p.blocks||[])+' '+(p.desc||'')+' '+(p.seoTitle||''),bad={};
      (raw.match(/\{\{prix_(?:fcfa_|court_)?\d+\}\}/g)||[]).forEach(function(x){if(PT[x.slice(2,-2)]==null)bad[x]=1;});
      Object.keys(bad).forEach(function(x){out.push({sev:'bad',text:'Page « '+p.title+' » : '+x+' ne correspond à aucun projet avec un prix (voir la page Commander).'});});
    });
  })();
  d.pages.forEach(function(p){
    p.blocks.forEach(function(b){
      ['cta1t','cta2t','target'].forEach(function(k){if(b[k])chkT(b[k],'Page « '+p.title+' », bloc '+(BT[b.type]?BT[b.type].label:b.type));});
      if((b.type==='image'||b.type==='presentation')&&b.image&&!b.alt)out.push({sev:'warn',text:'Page « '+p.title+' » : une image n’a pas de description (accessibilité et référencement).'});
      if(b.type==='video'&&b.url&&!videoSrc(b.url))out.push({sev:'bad',text:'Page « '+p.title+' » : le lien de la vidéo n’est pas reconnu (YouTube ou Vimeo).'});
      if(b.type==='map'&&b.url&&!mapSrc(b.url))out.push({sev:'bad',text:'Page « '+p.title+' » : le code de la carte n’est pas reconnu (Google Maps ou OpenStreetMap).'});
      if(b.type==='gallery'&&(b.images||[]).some(function(x){return !RES(x);}))out.push({sev:'bad',text:'Page « '+p.title+' » : une image de la galerie a été supprimée de la médiathèque.'});
    });
    if(p.status==='publié'&&(p.desc||'').length>160)out.push({sev:'warn',text:'Page « '+p.title+' » : la description dépasse 160 caractères, Google la coupera.'});
    if(p.status==='publié'&&String(p.seoTitle||p.title).length>60)out.push({sev:'warn',text:'Page « '+p.title+' » : titre de plus de 60 caractères, Google le coupera.'});
  });
  d.posts.forEach(function(a){
    if(a.status!=='publié')return;
    if(!a.excerpt)out.push({sev:'warn',text:'Article « '+a.title+' » : pas de résumé (utilisé par Google et le blog).'});
    if(!a.cover)out.push({sev:'warn',text:'Article « '+a.title+' » : pas d’image de couverture (aperçu de partage pauvre).'});
    if(a.date>today())out.push({sev:'warn',text:'Article « '+a.title+' » : planifié pour le '+fdate(a.date)+', il restera masqué jusqu’à cette date.'});
  });
  var seen={};
  d.pages.forEach(function(p){if(p.status!=='publié')return;var k=(p.seoTitle||p.title).toLowerCase();if(seen[k])out.push({sev:'warn',text:'Deux pages ont le même titre : « '+p.title+' ».'});seen[k]=1;});
  return out;
}

function applyStyle(isAdmin){

function processImage(file,maxw,fmt){
  return new Promise(function(res,rej){
    if(file.size>10*1024*1024){rej(new Error('Image trop lourde (10 Mo maximum).'));return;}
    if(file.type==='image/svg+xml'){
      if(file.size>300*1024){rej(new Error('Le fichier SVG dépasse 300 Ko.'));return;}
      var fr=new FileReader();fr.onload=function(){res(fr.result);};fr.onerror=function(){rej(new Error('Fichier illisible.'));};fr.readAsDataURL(file);return;
    }
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var sc=Math.min(1,maxw/im.width),w=Math.max(1,Math.round(im.width*sc)),h=Math.max(1,Math.round(im.height*sc));
      var c=document.createElement('canvas');c.width=w;c.height=h;
      var x=c.getContext('2d');
      if(fmt==='jpeg'){x.fillStyle='#FFFFFF';x.fillRect(0,0,w,h);}
      x.drawImage(im,0,0,w,h);URL.revokeObjectURL(url);
      res(c.toDataURL(fmt==='jpeg'?'image/jpeg':'image/png',0.82));
    };
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('Image illisible.'));};
    im.src=url;
  });
}

      var cx=clone(sx);cx.id=uid();cx.title=sx.title+' (copie)';cx.slug=sx.slug+'-copie';cx.status='brouillon';
      work.posts.push(cx);editing={kind:'post',id:cx.id};markDirty();render();break;}
    case 'trash':trashItem(el.dataset.kind,id);editing=null;markDirty();render();break;
    case 'restore':{
      var te=work.trash.find(function(x){return x.tid===el.dataset.tid;});if(!te)break;
      te.item.status='brouillon';
      if(te.kind==='page')work.pages.push(te.item);else work.posts.push(te.item);
      work.trash=work.trash.filter(function(x){return x.tid!==te.tid;});
      markDirty();setMsg('Élément restauré en brouillon. Enregistrez pour le garder.','warn');render();break;}
    case 'purge':work.trash=work.trash.filter(function(x){return x.tid!==el.dataset.tid;});markDirty();render();break;
    case 'empty-trash':work.trash=[];markDirty();render();break;
    case 'hist-restore':{
      var hv=work.history.find(function(x){return x.hid===el.dataset.hid;});if(!hv)break;
      var list=hv.kind==='page'?work.pages:work.posts,ix=list.findIndex(function(x){return x.id===hv.id;});
      if(ix>-1){var snap=clone(hv.snap);list[ix]=snap;markDirty();setMsg('Version du '+fdt(hv.date)+' restaurée. Enregistrez pour la garder.','warn');render();}
      break;}
    case 'img-clear':{var oc=getObj(el.dataset.o);if(oc){oc[el.dataset.f]='';markDirty();render();}break;}
    case 'blk-add':{var p1=getObj('p:'+id);p1.blocks.push(newBlock(document.getElementById('addtype').value));markDirty();render();break;}
    case 'blk-up':case 'blk-down':{
      var p2=getObj('p:'+id),i=p2.blocks.findIndex(function(b){return b.id===el.dataset.b;});
      mv(p2.blocks,i,a==='blk-up'?-1:1);markDirty();render();break;}
    case 'blk-dup':{
      var p4=getObj('p:'+id),i4=p4.blocks.findIndex(function(b){return b.id===el.dataset.b;});
      if(i4>-1){var nb=clone(p4.blocks[i4]);nb.id=uid();p4.blocks.splice(i4+1,0,nb);markDirty();render();}
      break;}
    case 'blk-del':{var p3=getObj('p:'+id);p3.blocks=p3.blocks.filter(function(b){return b.id!==el.dataset.b;});markDirty();render();break;}
    case 'media-del':{
      var mu=mediaUsage(id);
      if(mu>0){setMsg('Cette image est utilisée '+mu+' fois : retirez-la d’abord des pages ou articles.','err');break;}
      work.media=work.media.filter(function(x){return x.id!==id;});markDirty();render();break;}
    case 'redir-add':work.redirects.push({id:uid(),from:'',to:''});markDirty();render();break;
    case 'redir-del':work.redirects=work.redirects.filter(function(x){return x.id!==id;});markDirty();render();break;
    case 'fr-count':{
      if(!frFind){frMsg='Saisissez le texte à chercher.';render();break;}
      var c1=frApply(false);frMsg=c1?c1+' occurrence(s) trouvée(s).':'Aucune occurrence trouvée.';render();break;}
    case 'fr-do':{
      if(!frFind){frMsg='Saisissez le texte à chercher.';render();break;}
      var c2=frApply(true);frMsg=c2?c2+' remplacement(s) effectué(s). Enregistrez pour les garder.':'Aucune occurrence trouvée.';
      if(c2)markDirty();render();break;}
    case 'pin-set':{
      var pn=(document.getElementById('pin-new')||{}).value||'';
      if(pn.length<4){setMsg('Code trop court (4 caractères minimum).','err');break;}
      try{localStorage.setItem('gscPin',h53('gsc'+pn));sessionStorage.setItem('gscOk','1');setMsg('Verrou activé dans ce navigateur.','');}catch(_){setMsg('Le navigateur refuse l’enregistrement du code.','err');}
      render();break;}
    case 'pin-clear':try{localStorage.removeItem('gscPin');}catch(_){}setMsg('Verrou retiré.','');render();break;
    case 'card-preset':{
      var pk=el.dataset.p,ss=work.settings;
      if(pk==='classic'){ss.cardCustom=false;}
      else if(CARD_PRESETS[pk]){Object.keys(CARD_PRESETS[pk]).forEach(function(k){ss[k]=CARD_PRESETS[pk][k];});ss.cardCustom=true;}
      markDirty();render();break;}
    case 'card-colors-reset':{var s3=work.settings;s3.cardBg='';s3.cardBd='';s3.cardBar='';s3.cardInk='';markDirty();render();break;}
    case 'colors-reset':work.settings.brandColor='';work.settings.accentColor='';markDirty();DATA.settings.brandColor='';DATA.settings.accentColor='';render();break;
    case 'md':{
      var tx=document.getElementById(el.dataset.for);if(!tx)break;
      var s0=tx.selectionStart,e0=tx.selectionEnd,sl=tx.value.slice(s0,e0),f0=el.dataset.fmt,ins2='';
      if(f0==='bold')ins2='**'+(sl||'texte')+'**';
      else if(f0==='italic')ins2='*'+(sl||'texte')+'*';
      else if(f0==='link')ins2='['+(sl||'texte du lien')+'](https://)';
      else if(f0==='h')ins2='\n## '+(sl||'Intertitre')+'\n';
      else if(f0==='ul')ins2='\n- '+(sl||'Point')+'\n';
      else if(f0==='ol')ins2='\n1. '+(sl||'Étape')+'\n';
      else if(f0==='quote')ins2='\n> '+(sl||'Citation')+'\n';
      tx.setRangeText(ins2,s0,e0,'end');tx.focus();tx.dispatchEvent(new Event('input',{bubbles:true}));
      break;}
    case 'preview':openPreview(el.dataset.hash||'#accueil');break;
    case 'pv-w':{var pf=document.getElementById('pvf');if(pf)pf.style.width=el.dataset.w;break;}
    case 'pv-close':closePreview();break;
    case 'logout':try{localStorage.removeItem('gscAdmin');sessionStorage.removeItem('gscOk');}catch(_){}canEdit=false;break;
    case 'export-zip':doExport('zip');break;
    case 'export-pub':doExport('pub');break;
    case 'export-edit':doExport('edit');break;
    case 'export-json':doExport('json');break;
    case 'reset':confirmReset=true;render();break;
    case 'reset-yes':try{localStorage.removeItem(KEY_SITE);}catch(_){}DATA=ensure(clone(ORIGINAL));work=clone(DATA);dirty=false;confirmReset=false;setMsg('Contenu d’origine rétabli.','');render();break;
    case 'menu-add':work.menu.push({id:uid(),label:'Nouveau lien',target:'page:accueil'});markDirty();render();break;
    case 'menu-up':case 'menu-down':{var j=work.menu.findIndex(function(m){return m.id===id;});mv(work.menu,j,a==='menu-up'?-1:1);markDirty();render();break;}
    case 'menu-del':work.menu=work.menu.filter(function(m){return m.id!==id&&m.parent!==id;});markDirty();render();break;
  }
}

/* ---------- démarrage ---------- */
function restore(){
  try{
    var ui=sessionStorage.getItem(KEY_UI);
    if(ui){sessionStorage.removeItem(KEY_UI);editing=(JSON.parse(ui)||{}).editing||null;}
    var w=sessionStorage.getItem(KEY_WORK);
    if(w){sessionStorage.removeItem(KEY_WORK);work=JSON.parse(w);dirty=true;msg={t:'Vos modifications ont été conservées. Enregistrez pour les garder.',c:'warn'};}
  }catch(e){}
}
function checkAccess(){
  var ok=false,pinned=false,unlocked=false;
  if(!PUBLIC){
    try{if(route().k==='admin')localStorage.setItem('gscAdmin','1');ok=localStorage.getItem('gscAdmin')==='1';}
    catch(e){ok=route().k==='admin';}
    try{pinned=!!localStorage.getItem('gscPin');unlocked=sessionStorage.getItem('gscOk')==='1';}catch(e){}
  }
  locked=ok&&pinned&&!unlocked;
  canEdit=ok&&!locked;accessChecked=true;
}
function analytics(){
  if(canEdit||locked)return;
  var d=String(DATA.settings.plausible||'').trim();
  if(d&&/^https?:$/.test(location.protocol)&&!document.getElementById('plausible-js')&&/^[a-z0-9.-]+$/i.test(d)){
    var s=document.createElement('script');
    s.id='plausible-js';s.defer=true;
    s.src='https://plausible.io/js/'+(STATIC?'script.js':'script.hash.js');
    s.setAttribute('data-domain',d);
    document.head.appendChild(s);
  }
  var hc=String(DATA.settings.headCode||'').trim();
  if(hc&&PUBLIC&&!STATIC&&!DATA.preview&&!document.getElementById('head-code-flag')){
    try{
      var fl=document.createElement('meta');fl.id='head-code-flag';fl.setAttribute('name','head-code');document.head.appendChild(fl);
      document.head.appendChild(document.createRange().createContextualFragment(hc));
    }catch(e){}
  }
}
function initTheme(){try{var t=localStorage.getItem('gscTheme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}}
document.addEventListener('click',onClick);
document.addEventListener('input',onInput);
document.addEventListener('change',onChange);
document.addEventListener('submit',onSubmit);
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&(e.key==='s'||e.key==='S')&&canEdit&&route().k==='admin'){e.preventDefault();save();}
  if(e.key==='Escape')closePreview();
});
window.addEventListener('scroll',updateTop,{passive:true});
window.addEventListener('hashchange',function(){checkAccess();confirmDel=null;confirmReset=false;if(route().k!=='admin'){editing=null;closePreview();}render();window.scrollTo(0,0);});
initTheme();
restore();
syncProjectCatalog(DATA);
checkAccess();
render();
analytics();
})();

</script>

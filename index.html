<style id="app-style">

/* Layout concept: vitrine en bandes pleine largeur, avec un « chemin » de 10 étapes en fil conducteur ; espace admin type WordPress (barre latérale sombre + zone d'édition). */
:root{
  --bg:#F7F6FB; --surface:#FFFFFF; --ink:#1C1842; --muted:#5B5878; --line:#DEDCEC;
  --brand:#29235C; --brand-ink:#FFFFFF; --wash:#EEECF8;
  --accent:#E6007E; --accent-ink:#FFFFFF;
  --hero-bg:#29235C; --hero-ink:#FFFFFF; --hero-muted:#C3BFE6; --hero-accent:#FF6BB8;
  --danger:#B3261E; --ok:#1B7A4B; --adminbar:#1C1842;
  --show-l:inline-block; --show-d:none;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#100E26; --surface:#19163A; --ink:#EEECFA; --muted:#A9A6C8; --line:#2E2A57;
    --brand:#A9A0FF; --brand-ink:#100E26; --wash:#221E4A;
    --danger:#FF8A80; --ok:#5FD39A; --adminbar:#0B0A1C;
    --show-l:none; --show-d:inline-block; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#100E26; --surface:#19163A; --ink:#EEECFA; --muted:#A9A6C8; --line:#2E2A57;
  --brand:#A9A0FF; --brand-ink:#100E26; --wash:#221E4A;
  --danger:#FF8A80; --ok:#5FD39A; --adminbar:#0B0A1C;
  --show-l:none; --show-d:inline-block; color-scheme:dark;
}
*{box-sizing:border-box}
body{font-family:var(--f-body);font-size:16px;line-height:1.6;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{width:min(1120px,100%);margin-inline:auto;padding-inline:20px}

/* barre admin (site public, éditeurs) */
.abar{background:var(--adminbar);color:#E8F0EC;font-size:13px}
.abar .wrap{display:flex;gap:6px 20px;flex-wrap:wrap;align-items:center;padding-block:8px}
.abar a{text-decoration:none;color:#E8F0EC}
.abar a:hover{text-decoration:underline}
.abar .sp{flex:1}

/* en-tête */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 24px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.mark{font:800 15px var(--f-display);letter-spacing:.05em;background:var(--brand);color:var(--brand-ink);padding:7px 9px;border-radius:6px}
.logo{height:46px;width:auto;display:block}
.logo-l{display:var(--show-l)}
.logo-d{display:var(--show-d)}
.ftr .logo{height:60px;margin-bottom:12px}
.bn{font:700 17px var(--f-display)}
.nav{display:flex;flex-wrap:wrap;gap:0 4px;list-style:none;margin:0;padding:0}
.nav a{display:block;padding:8px 11px;text-decoration:none;font-weight:500;font-size:15px;color:var(--muted);border-bottom:2px solid transparent}
.nav a:hover{color:var(--ink)}
.nav a[aria-current=page]{color:var(--ink);border-bottom-color:var(--accent)}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:8px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:600 15px var(--f-body);text-decoration:none;cursor:pointer;text-align:center}
.btn:hover{filter:brightness(1.07)}
.btn.line{background:transparent;color:inherit;border-color:currentColor}
.btn.dark{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}

/* bandeau */
.hero{background:var(--hero-bg);color:var(--hero-ink)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:40px 64px;padding-block:72px;align-items:center}
.hero-grid.solo{grid-template-columns:minmax(0,820px)}
.hero h1{font-size:clamp(2.3rem,5.4vw,4rem);font-weight:800;letter-spacing:-.025em}
.eyebrow{font:500 12.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--hero-accent);margin-bottom:18px}
.hero-text{color:var(--hero-muted);font-size:1.12rem;max-width:56ch;margin-top:20px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.trail{list-style:none;margin:0;padding:0}
.trail li{position:relative;display:flex;gap:14px;align-items:baseline;padding:0 0 13px 28px}
.trail li::before{content:"";position:absolute;left:0;top:.5em;width:10px;height:10px;border-radius:50%;background:var(--hero-ink);opacity:.85}
.trail li::after{content:"";position:absolute;left:4.5px;top:calc(.5em + 10px);bottom:-.45em;width:1px;background:var(--hero-muted);opacity:.5}
.trail li:last-child{padding-bottom:0}
.trail li:last-child::after{display:none}
.trail li:last-child::before{background:var(--hero-accent);width:14px;height:14px;left:-2px;top:.35em;opacity:1}
.tn{font:500 12px var(--f-mono);color:var(--hero-accent);min-width:22px}
.tt{font:600 1rem var(--f-display)}

/* sections */
.phead{border-bottom:1px solid var(--line)}
.phead .wrap{padding-block:48px 36px}
.phead h1{font-size:clamp(2rem,4.4vw,3rem);font-weight:800}
.sec{padding-block:64px}
.sec + .sec{padding-top:0}
.sec h2{font-size:clamp(1.6rem,3.2vw,2.2rem);font-weight:700}
.lead{color:var(--muted);max-width:62ch;margin-top:12px;font-size:1.05rem}
.rich{max-width:68ch}
.rich p,.rich ul{margin-top:14px}
.rich h3{margin-top:28px;font-size:1.25rem}
.rich ul{padding-left:1.2em}
.rich li{margin-top:6px}
.sec .rich:first-child{margin-top:0}
.sec h2 + .rich{margin-top:8px}

.stepgrid,.cardgrid{list-style:none;margin:32px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.stepcard,.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.stepcard h3,.card h3{font-size:1.15rem}
.stepcard p,.card p{color:var(--muted);font-size:15px}
.num{font:500 12.5px var(--f-mono);color:var(--brand);background:var(--wash);padding:3px 8px;border-radius:4px;align-self:flex-start;letter-spacing:.06em}
.deliv{margin-top:auto;padding-top:10px}
.lbl{display:block;font:500 11.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.stepcard .deliv{color:var(--ink);font-size:14.5px}

.steplist{list-style:none;margin:32px 0 0;padding:0;display:grid;gap:0;border-top:1px solid var(--line)}
.srow{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px 20px;padding:28px 0;border-bottom:1px solid var(--line)}
.snum{font:500 28px var(--f-mono);color:var(--accent)}
.srow h3{font-size:1.4rem}
.ssub{color:var(--muted);margin-top:6px}
.blt{margin:14px 0 0;padding-left:1.2em}
.blt li{margin-top:5px}
.srow .tools,.srow .deliv{margin-top:16px;padding-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:13.5px;background:var(--wash);border-radius:999px;padding:4px 12px}

.band{background:var(--hero-bg);color:var(--hero-ink)}
.band .wrap{padding-block:56px;display:grid;gap:14px;justify-items:start}
.band h2{font-size:clamp(1.6rem,3.2vw,2.2rem);font-weight:800}
.band p{max-width:58ch;opacity:.9}

.contact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:28px}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.crow .lbl{flex:0 0 100%;margin:0}
.crow .val{user-select:all;overflow-wrap:anywhere;font-weight:500}
.links{display:grid;gap:8px;align-content:start}
.links a{padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-decoration:none;font-weight:500}
.links a:hover{border-color:var(--accent)}

.postgrid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pcard h3{font-size:1.25rem}
.pcard h3 a{text-decoration:none}
.pcard h3 a:hover{text-decoration:underline}
.meta{font:500 12px var(--f-mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.pcard p{color:var(--muted);font-size:15px}
.post{padding-block:48px 72px}
.post h1{font-size:clamp(2rem,4.4vw,3rem);font-weight:800;margin:10px 0 24px;max-width:22ch}
.back{font-size:14px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
.notice{background:var(--wash);border-left:4px solid var(--accent);padding:12px 16px;font-size:14.5px;margin-bottom:24px}
.pill{display:inline-block;font:500 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--wash);color:var(--muted)}
.pill.ok{color:var(--ok)}

.ftr{background:var(--adminbar);color:#C9D8D2;margin-top:24px}
.ftr .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:32px;padding-block:48px}
.ftr h4{margin:0 0 10px;font:500 11.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#8FA79E}
.ftr a{color:#E8F0EC;text-decoration:none;display:block;padding:3px 0}
.ftr a:hover{text-decoration:underline}
.ftr p{font-size:14.5px;overflow-wrap:anywhere}
.ftr .fb{font:700 1.1rem var(--f-display);color:#fff;margin-bottom:8px}
.copy{border-top:1px solid #26382F;font-size:13px;color:#8FA79E}
.copy .wrap{padding-block:16px;display:block}

/* admin */
.adm{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh;background:var(--bg)}
.side{background:var(--adminbar);color:#E8F0EC;padding:18px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;align-self:start;height:100vh}
.side .sb{font:800 15px var(--f-display);padding:6px 10px 14px;letter-spacing:.02em}
.side a{display:block;padding:9px 12px;border-radius:6px;text-decoration:none;color:#C9D8D2;font-size:14.5px}
.side a:hover{background:#1F312B}
.side a[aria-current=page]{background:#2A423A;color:#fff}
.side .grow{flex:1}
.adm-main{min-width:0}
.adm-top{display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.adm-top .st{font-size:14px;color:var(--muted)}
.adm-top .st.warn{color:var(--accent-ink);background:var(--accent);padding:2px 8px;border-radius:4px}
.adm-top .st.err{color:var(--danger)}
.adm-body{padding:24px;max-width:960px}
.adm-body h1{font-size:1.7rem;font-weight:800;margin-bottom:6px}
.adm-body .sub{color:var(--muted);margin-bottom:22px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.fld{display:grid;gap:6px;margin-bottom:14px}
.fld label,.chk label{font-weight:600;font-size:14px}
.fld small{color:var(--muted);font-size:12.5px}
input[type=text],input[type=tel],input[type=email],select,textarea{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
input[readonly]{opacity:.65}
textarea{resize:vertical;min-height:90px}
.chk{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.chk input{width:18px;height:18px;accent-color:var(--brand)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.blk{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:12px}
.blk-h{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--wash);border-radius:10px 10px 0 0;font-weight:600;font-size:14px}
.blk-b{padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:500 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
td .row{flex-wrap:nowrap}
td a.t{font-weight:600;text-decoration:none}
td a.t:hover{text-decoration:underline}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.stat b{display:block;font:800 2rem var(--f-display)}
.stat span{color:var(--muted);font-size:14px}
.gate{max-width:520px;margin:15vh auto;padding:0 20px;display:grid;gap:14px;justify-items:start}
.gate h1{font-size:1.8rem}
details.panel summary{cursor:pointer;font-weight:600}
details.panel[open] summary{margin-bottom:14px}

@media (max-width:820px){

/* v2 : accessibilité, formulaire, FAQ, blog, partage, menu mobile */

.quote{margin:0 0 10px;font-size:1.05rem;font-style:italic}
.fig{margin:0;max-width:820px}
.fig.wide{max-width:none}

.chipbar{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}

/* v3 : thèmes Élégant et Prestige (réservés au site public) */
:root[data-style]{--f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;--f-body:"Jost","Public Sans","Segoe UI",system-ui,sans-serif}

[data-style] body{font-size:17px;line-height:1.7;font-weight:400;letter-spacing:.005em}
[data-style] h1,[data-style] h2,[data-style] h3{font-weight:500;letter-spacing:-.005em;line-height:1.1}
[data-style] .sec h2,[data-style] .band h2{font-size:clamp(2rem,4vw,3rem);font-weight:500}
[data-style] .sec h2::after{content:"";display:block;width:56px;height:1px;background:var(--accent);margin-top:18px}
[data-style] .band h2::after,[data-style] .nlbox h2::after{margin-inline:0}
[data-style] h3{font-size:1.45rem}
[data-style] .phead .wrap{padding-block:72px 48px}
[data-style] .phead h1{font-size:clamp(2.6rem,6vw,4.4rem);font-weight:500}
[data-style] .lead{font-size:1.15rem;font-weight:300}
[data-style] .sec{padding-block:96px}
[data-style] .sec .rich{font-size:1.06rem}
[data-style] .eyebrow,[data-style] .meta,[data-style] .lbl{font-family:var(--f-body);letter-spacing:.26em;font-size:11.5px;font-weight:500}
/* en-tête */
[data-style] .hdr{background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line)}
[data-style] .hdr .wrap{padding-block:16px}
[data-style] .logo{height:52px}

[data-style] .nav a[aria-current=page]{border-bottom-color:var(--accent)}
[data-style] .sub-menu{border-radius:0}
[data-style] .announce{background:var(--brand);color:var(--brand-ink);letter-spacing:.12em;text-transform:uppercase;font-size:12px}
/* boutons */
[data-style] .btn{border-radius:0;text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:500;padding:15px 28px;transition:background .25s,color .25s,border-color .25s,transform .25s}
[data-style] .btn.sm{padding:9px 16px;font-size:11px}

[data-style] .btn.line{border-width:1px}
[data-style] .btn.dark{border-width:1px}
[data-style] .tbtn,[data-style] .menu-btn,[data-style] input[type=text],[data-style] input[type=search],[data-style] select,[data-style] textarea{border-radius:0}
/* bandeau */
[data-style] .hero-grid{padding-block:120px;gap:48px 80px}
[data-style] .hero h1{font-size:clamp(2.8rem,6.4vw,5.2rem);font-weight:500;line-height:1.02}
[data-style] .hero-text{font-weight:300;font-size:1.2rem}
[data-style] .eyebrow{display:flex;align-items:center;gap:14px}

[data-style] .band .wrap{padding-block:88px;justify-items:center;text-align:center}
[data-style] .band h2::after{margin-inline:auto}

/* cartes */
[data-style] .card,[data-style] .pcard,[data-style] .stepcard,[data-style] .faq details,[data-style] .cform,[data-style] .nlbox{border-radius:0;box-shadow:none;border-color:var(--line)}

[data-style] .pcard .cover,[data-style] .cover.big,[data-style] .fig img,[data-style] .gal img,[data-style] .video,[data-style] .mapw{border-radius:0}

/* ---------- étapes d'un projet ---------- */
.phases{list-style:none;margin:28px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.phases.ph-list{grid-template-columns:1fr}
.ph{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding:18px;background:var(--surface,#fff);border:1px solid var(--line);border-radius:14px}
.ph-n{font:600 15px var(--f-mono);color:var(--brand);background:var(--wash);height:38px;width:38px;border-radius:50%;display:grid;place-items:center}
.ph-n:empty{display:none}.ph:has(.ph-n:empty){grid-template-columns:1fr}
.ph h3{font-size:1.08rem;margin:0 0 4px}
.ph-b p{margin:0;color:var(--muted);font-size:15.5px;line-height:1.5}
.ph-b .ph-d{margin-top:10px;color:var(--ink);font-size:14.5px}
.ph-b .ph-d .lbl{margin-bottom:2px}
@media (max-width:760px){.phases{grid-template-columns:1fr}.ph{padding:15px;grid-template-columns:38px minmax(0,1fr);gap:12px}.ph-n{height:34px;width:34px}}

/* ---------- livrables d'un projet ---------- */
.dlv{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:0;border-top:1px solid var(--line)}
.dl{display:grid;grid-template-columns:48px minmax(0,1fr);gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
.dl-n{font:600 15px var(--f-mono);color:var(--accent);padding-top:2px}
.dl h3{font-size:1.08rem;margin:0 0 6px}
.dl-r{margin:0;color:var(--ink);font-size:15.5px;line-height:1.5}
.dl-r .lbl{margin-bottom:2px}
.dl-s{display:inline-block;margin-top:10px;font-size:12.5px;font-weight:600;color:var(--brand);background:var(--wash);border-radius:999px;padding:3px 11px}
@media (max-width:760px){.dl{grid-template-columns:34px minmax(0,1fr);gap:10px}}

/* ---------- deux cartes côte à côte ---------- */
.duo{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:stretch}
.duo.duo-eq{grid-template-columns:repeat(2,minmax(0,1fr))}
.duo-c{border:1px solid var(--line);border-radius:16px;padding:24px;background:var(--surface,#fff);position:relative;overflow:hidden}
.duo-c::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--accent)}
.duo-b{background:var(--wash)}.duo-b::before{background:var(--brand)}
.duo-c h3{font-size:1.2rem;margin:4px 0 6px}
.duo-c .rich{max-width:none}
.duo-c .rich ul{list-style:none;padding:0;margin:10px 0 0}
.duo-c .rich li{position:relative;padding-left:26px;margin-top:9px}
.duo-c .rich li::before{content:"✓";position:absolute;left:0;top:0;color:var(--accent);font-weight:700}
.duo-b .rich li::before{color:var(--brand)}
@media (max-width:760px){.duo,.duo.duo-eq{grid-template-columns:1fr}.duo-c{padding:20px}}
.duo-b .rich li strong:nth-of-type(n+2)::before{content:"\A";white-space:pre;display:inline}
.duo-b .rich li strong:nth-of-type(n+2){display:inline;line-height:2}
.duo-b .rich li{line-height:1.5;font-size:15.5px}

/* ---------- présentation : texte et image ---------- */
.pres{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:center}
.pres.pres-l .pres-img{order:-1}
.pres-eb{font:600 12.5px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.pres-t h2{margin:0 0 14px}
.pres-t .rich{max-width:none}
.pres-img{margin:0}
.pres-img img{width:100%;height:auto;max-height:520px;object-fit:cover;border-radius:16px;display:block}
.pres-empty{min-height:300px;border:2px dashed var(--line);border-radius:16px;background:var(--wash);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted)}
.pres-empty span{font-weight:700;font-size:1.1rem}
.pres-empty small{display:block;font-weight:400;font-size:13.5px;margin-top:4px}
@media (max-width:760px){.pres{grid-template-columns:1fr;gap:22px}.pres.pres-l .pres-img{order:0}}

</style>

,"target":"page:partenaires-et-outils"},{"id":"m6","label":"Blog","target":"blog"},{"id":"m7","label":"Contact","target":"page:contact"}],"steps":[{"n":1,"short":"Clarification","title":"Clarification du projet","sub":"Définir votre mission : idée, problème résolu, cible et offre de valeur.","bullets":["Un questionnaire envoyé 48 h avant le premier rendez-vous","Un entretien de découverte de 60 à 90 minutes","Une fiche de clarification d’une page, validée par vous avant de continuer"],"tools":["Questionnaire de clarification","Grille d’idéation et de reformulation","Canevas de proposition de valeur"],"deliv":"Une fiche de clarification de projet : mission, cible, problème, offre de valeur."},{"n":2,"short":"Marché","title":"Validation du marché","sub":"Confirmer que le besoin existe vraiment, sur le terrain.","bullets":["Analyse des concurrents directs et indirects : positionnement et prix","5 à 10 entretiens ou un mini-sondage auprès de votre cible","Validation ou ajustement de l’hypothèse de rentabilité"],"tools":["Grille d’analyse concurrentielle","Trame d’enquête terrain","Méthode des personas"],"deliv":"Une étude de marché rapide (demande, concurrence, prix, rentabilité) et une fiche persona."},{"n":3,"short":"Structure","title":"Structuration du business","sub":"Bâtir le modèle : offre, prix, processus et ressources.","bullets":["Atelier Business Model Canvas de 2 heures","Définition de l’offre, des prix et des conditions commerciales","Formalisation des processus clés : production, livraison, facturation","Liste des ressources humaines, techniques et financières"],"tools":["Business Model Canvas","Grille tarifaire type","Cartographie de processus internes"],"deliv":"Un Business Model Canvas rempli, une grille tarifaire et des fiches de processus."},{"n":4,"short":"Marque","title":"Positionnement et marque","sub":"Se démarquer avec une promesse claire et une identité cohérente.","bullets":["Atelier de positionnement","Promesse de marque et message clé en une phrase","Identité visuelle : logo, couleurs, typographie","Vérification de la cohérence face à 2 ou 3 concurrents directs"],"tools":["Brand Platform Canvas","Moodboard et références visuelles","Charte graphique type"],"deliv":"Une fiche de positionnement et une charte d’identité de marque simplifiée."},{"n":5,"short":"Acquisition","title":"Acquisition client","sub":"Générer des prospects qualifiés avec un plan d’action daté.","bullets":["2 à 3 canaux prioritaires choisis selon votre cible","Calendrier d’actions sur 4 à 8 semaines","Suivi des prospects dans un outil centralisé","Point hebdomadaire sur le volume et la qualité des prospects"],"tools":["Plan d’action commercial","Calendrier de contenu","CRM ou tableau de suivi des prospects"],"deliv":"Un plan d’acquisition (canaux, actions, fréquence, responsable) et un tableau de suivi des prospects."},{"n":6,"short":"Vente","title":"Conversion et vente","sub":"Transformer les prospects en clients.","bullets":["Diagnostic gratuit pour cerner précisément le besoin","Présentation de l’offre appuyée sur des preuves concrètes","Traitement des objections avec une grille dédiée","Devis envoyé sous 48 h, relance sous 5 jours si besoin"],"tools":["Trame d’entretien de vente","Grille de traitement des objections","Modèle de devis et de contrat"],"deliv":"Une trame de vente en 4 temps, un modèle de devis et un modèle de contrat ou de bon de commande."},{"n":7,"short":"Livraison","title":"Livraison et satisfaction","sub":"Tenir ses promesses et fidéliser.","bullets":["Réunion de lancement pour chaque mission","Points d’étape réguliers selon les jalons définis","Chaque étape livrée avec un document ou un support concret","Questionnaire de satisfaction en fin de mission"],"tools":["Plan de suivi de mission","Questionnaire de satisfaction","Outil de gestion de projet client"],"deliv":"Une fiche de suivi (jalons, livrables, échéances) et un questionnaire de satisfaction."},{"n":8,"short":"Système","title":"Automatisation et système","sub":"Gagner du temps en rendant le travail reproductible.","bullets":["Repérage des tâches répétitives sur les 5 dernières missions","Transformation de chaque tâche en modèle ou en checklist","Centralisation des modèles dans un outil unique","Mise à jour de la bibliothèque tous les trimestres"],"tools":["CRM","Tableau Kanban","Bibliothèque de documents et modèles réutilisables"],"deliv":"Une bibliothèque centralisée de modèles et une checklist de mission standardisée."},{"n":9,"short":"Croissance","title":"Développement et croissance","sub":"Piloter avec des chiffres plutôt qu’au ressenti.","bullets":["Tableau de bord mis à jour chaque mois","Analyse des résultats une fois par trimestre","Une action d’optimisation et une piste de diversification par trimestre","Décisions documentées pour capitaliser sur l’expérience"],"tools":["Tableau de bord d’indicateurs clés","Grille d’analyse de résultats","Plan de diversification de l’offre"],"deliv":"Un tableau de bord mensuel (prospects, conversions, satisfaction, chiffre d’affaires) et une fiche d’analyse trimestrielle."},{"n":10,"short":"Impact et liberté","title":"Impact et liberté","sub":"Construire durablement et libérer du temps stratégique.","bullets":["Bilan d’impact une fois par an","Identification des tâches à déléguer","Mise à jour de la vision à 3 ans","Partage du bilan avec l’équipe et, si pertinent, avec les clients fidèles"],"tools":["Bilan d’impact annuel","Plan de délégation par fonction","Vision stratégique à 3 ans"],"deliv":"Un bilan d’impact annuel, un plan de délégation par fonction et une vision stratégique à 3 ans."}],"pages":[{"id":"p_accueil","slug":"accueil","title":"Accueil","status":"publié","desc":"Cabinet d’accompagnement : {{nb_projets}} projets à prix affichés pour lancer, structurer et faire grandir votre activité.","blocks":[{"eyebrow":"GSC Business Center · Cabinet de Conseil & Formation","title":"De l’idée à la liberté entrepreneuriale.","text":"GSC Business Center est un cabinet d’accompagnement. Nous aidons les porteurs de projet, les entrepreneurs, les TPE et les PME à lancer, structurer et faire grandir leur activité, avec une méthode et des prix affichés.","cta1l":"Réserver mon diagnostic gratuit","cta1t":"page:contact","cta2l":"Voir nos {{nb_projets}} projets","cta2t":"page:nos-projets","trail":false,"type":"hero","id":"b1"},{"heading":"","items":[{"title":"{{nb_projets}}","text":"projets au catalogue"},{"title":"6","text":"besoins d’entreprise couverts"},{"title":"1 h","text":"de diagnostic gratuit"},{"title":"48 h","text":"pour recevoir votre devis"}],"type":"stats","id":"b2"},{"id":"b_presentation","type":"presentation","eyebrow":"Présentation","heading":"Ma présentation","body":"**Ablaye NDIAYE **\n**Coach entrepreneur et consultant en entreprise**\nJe suis le CEO Fondateur de GSC Business Center. Coach entrepreneur et formateur depuis plus de 8 ans, je crée et développe des entreprises, de l’idée jusqu’à leur mise en œuvre. J’ai accompagné de nombreux porteurs de projet dans la structuration de leur activité, du business model jusqu’au business plan, notamment des start-ups, réalisé de nombreux sites web et assuré la gestion des réseaux sociaux de grands groupes comme de micro-entreprises. Mon champ de compétences comprend l’étude et l’élaboration de projet (business model et business plan), la création et l’administration de sites web, l’élaboration de stratégies et la mise en œuvre de plans marketing, le copywriting et les outils marketing de Google (Google Analytics, Google My Business, Google Ads, Google Tag Manager). J’accompagne les entreprises et les start-ups dans la concrétisation et la maturation de leurs idées en projets d’entreprise. \nAu fil de mon parcours, j’ai collaboré avec des structures et programmes de référence tels que APTE Sénégal, le Programme Formation Professionnelle et Insertion (PFPI), PEJA Sénégal, Power People Inclusion (PPI)-JAPALE MA, Les Santinelle, ECLOSIO, la Coopération ULB et le Campus Kabongoye, sans oublier mon expérience de freelance et de consultant indépendant. Ces collaborations m’ont permis de développer une approche pratique, adaptée aux réalités locales et aux besoins des entrepreneurs modernes.","image":"media:jjbh0s","alt":"","side":"right","bg":"alt"},{"heading":"Un cabinet, une méthode, un chemin","body":"Notre catalogue réunit {{nb_projets}} projets. Chacun répond à un besoin précis de l’entreprise : se lancer, vendre, être visible, diriger, se structurer, se digitaliser ou accélérer. La Méthode GSC est notre approche méthodologique transversale : elle guide chaque diagnostic, parcours et accompagnement, du cadrage initial jusqu’au suivi des résultats.\nPlus un projet couvre de besoins, plus il est complet.\n> Nous ne vendons pas des heures de conseil : nous livrons des résultats concrets, étape par étape.","type":"text","id":"b3"},{"heading":"Nos quatre familles de projets","intro":"Du plus simple au plus complet. Prix en FCFA, fixes pour toute la durée du projet (sauf le Community management, facturé chaque mois).","items":[{"title":"Démarrer","text":"Se lancer avec un coach ou un business plan. 1. Coaching starter · 11. Business plan simplifié · 12. Business plan complet"},{"title":"Être visible et vendre en ligne","text":"Tunnels de vente, réseaux sociaux, site web. 2. Création des tunnels de vente · 3. Community management · 4. Création de site web"},{"title":"Diriger, structurer et faire croître","text":"Leadership, croissance et performance des PME. 5. Coaching en leadership et management · 6. Coaching stratégique et croissance · 7. Conseil et accompagnement à la performance des PME"},{"title":"Transformer et accélérer","text":"Passer au numérique ou accélérer très fortement. 9. Transformation digitale · 10. Business accelerator premium"}],"type":"cards","id":"b4"},{"id":"b4t","type":"text","heading":"Choisissez votre projet","body":"Chaque projet a un prix affiché et un devis sous 48 h. Cliquez sur « Commander ce projet » pour démarrer."},{" ce et d’organisation ; > Entreprises déjà en activité."},{"title":"7","text":"Améliorez la performance de votre PME","extra":"Diagnostic organisationnel ; administration et finances ; ventes, équipes et outils ; application de la Méthode GSC ; > TPE et PME qui souhaitent structurer leur activité."},{"title":"8","text":"Accélérez votre transformation digitale","extra":"Diagnostic digital ; choix et intégration d’outils ; amélioration des processus ; automatisation des tâches ; > Entreprises qui souhaitent accélérer leur transition numérique."},{"title":"9","text":"Accélérez votre entreprise avec un accompagnement premium","extra":"Stratégie d’accélération ; organisation et développement commercial ; gestion comptable selon le périmètre convenu ; recherche de marchés publics ; # Sur sélection ; > Entreprises à fort potentiel."}]},{"heading":"Nos valeurs","intro":"","items":[{"title":"1 · Méthode","text":"Chaque projet est découpé en étapes, avec un livrable à la fin de chacune."},{"title":"2 · Clarté","text":"Des mots simples, des outils lisibles et des prix affichés."},{"title":"3 · Accompagnement","text":"Un suivi du début à la fin, pas un simple conseil."},{"title":"4 · Résultat concret","text":"Des actions que vous appliquez dès la fin de chaque étape."},{"title":"5 · Liberté","text":"Notre but est votre autonomie."}],"type":"cards","id":"b5"},{"heading":"Comment se déroule un projet","intro":"","items":[{"title":"1 · Diagnostic gratuit","text":"1 heure pour comprendre votre besoin."},{"title":"2 · Choix du projet","text":"Le projet qui correspond à votre situation."},{"title":"3 · Devis","text":"Sous 48 h, avec une relance sous 5 jours."},{"title":"4 · Lancement","text":"Une réunion de démarrage."},{"title":"5 · Suivi","text":"Étape par étape, un livrable à chaque jalon."},{"title":"6 · Satisfaction","text":"Un questionnaire en fin de projet."}],"type":"cards","id":"b6"},{"heading":"Le premier pas est gratuit","text":"Un diagnostic d’une heure pour savoir où en e "titleA":"Ce que vous obtenez","bodyA":"- Un diagnostic de votre niveau et de vos besoins\n- Un plan d’action personnalisé avec des indicateurs de progression\n- Une formation de base : business, gestion, marketing digital, réseaux sociaux\n- Un projet structuré : modèle économique, offre, positionnement\n- Des séances de coaching individuelles et un suivi de vos actions\n- Un bilan final, vos supports et un rapport","titleB":"Besoins couverts","bodyB":"- **Stratégie et plan** — **À quoi ça sert :** Définir où va votre entreprise et le chemin pour y arriver. **Pourquoi c’est important :** Sans cap, on dépense du temps et de l’argent sans avancer. **Dans ce projet :** Vous repartez avec un plan d’action personnalisé et un modèle économique clair.\n- **Vente et marketing** — **À quoi ça sert :** Faire connaître votre offre et transformer les contacts en clients. **Pourquoi c’est important :** Sans clients, pas de chiffre d’affaires : c’est ce qui fait vivre l’entreprise. **Dans ce projet :** Vous apprenez à trouver vos premiers clients et à utiliser le marketing digital.","ratio":"equal"},{"id":"b5","type":"phases","heading":"Les étapes de création et de formalisation","intro":"Voici, étape par étape, ce que nous faisons ensemble et ce que vous obtenez.","layout":"grid","showNum":true,"showDeliv":true,"items":[{"title":"Accueil et intégration","text":"On fait connaissance, on fixe vos objectifs et on vous explique le déroulement du projet.","extra":"Une fiche de départ et le calendrier du projet"},{"title":"Diagnostic initial","text":"On évalue votre niveau, votre idée et vos besoins pour savoir par où commencer.","extra":"Un diagnostic écrit de votre situation"},{"title":"Planification","text":"On transforme vos objectifs en un plan d’action simple, avec des dates et des indicateurs.","extra":"Un plan d’action personnalisé"},{"title":"Formation de base","text":"Vous apprenez l’essentiel : business, gestion, marketing digital et réseaux sociaux.","extra":"Vos supports de formation"},{"title":"Structuration du projet","text":"On construit votre modèle économique, votre offre et votre positionnement.","extra":"Un projet structuré, noir sur blanc"},{"title":"Développement commercial","text":"On vous aide à trouver vos premiers clients : cible, message et prospection.","extra":"Un plan de vente et vos premiers contacts"},{"title":"Gestion financière","text":"Vous apprenez à calculer vos prix, vos coûts et votre budget.","extra":"Un budget simple et vos prix fixés"},{"title":"Diagnostic et cadrage du projet","text":"Clarification de l’idée, analyse des besoins et choix du niveau d’accompagnement.","extra":"Des actions suivies séance après séance"},{"title":"Outils et digitalisation","text":"On met en place les outils numériques utiles à votre activité.","extra":"Vos outils prêts à l’emploi"},{"title":"Suivi et évaluation","text":"On mesure les résultats et on corrige ce qui doit l’être.","extra":"Un tableau de suivi à jour"},{"title":"Développement personnel","text":"On travaille votre confiance, votre organisation et vos habitudes d’entrepreneur.","extra":"Une routine de travail adaptée"},{"title":"Clôture","text":"Bilan final, remise de vos supports et définition des prochaines étapes.","extra":"Un rapport final et tous vos supports"}]},{"id":"b5l","type":"deliverables","heading":"Les livrables du projet","intro":"Tout ce que vous recevez à la fin du projet, et à quoi cela sert à votre entreprise.","roleLabel":"À quoi il sert","showNum":true,"showStep":true,"items":[{"title":"Démarches administratives","text":"Orientation et accompagnement dans les formalités de création selon la situation du projet."},{"title":"Documents administratifs","text":"Préparation ou structuration des documents nécessaires au dossier de l’entreprise."},{"title":"Business plan","text":"Business plan simplifié ou complet selon les besoins, le niveau d’étude et le périmètre convenu."},{"title":"Plan de lancement","text":"Prochaines étapes et recommandations uences automatiques et des tests avant la mise en ligne\n- Un tableau de bord pour suivre vos prospects et vos ventes","titleB":"Besoins couverts","bodyB":"- **Vente et marketing** — **À quoi ça sert :** Faire connaître votre offre et transformer les contacts en clients. **Pourquoi c’est important :** Sans clients, pas de chiffre d’affaires : c’est ce qui fait vivre l’entreprise. **Dans ce projet :** Un tunnel complet qui amène des visiteurs, les convainc et encaisse leur paiement.\n- **Outils digitaux** — **À quoi ça sert :** Faciliter et automatiser le travail : site, messages, suivi des clients. **Pourquoi c’est important :** Vous gagnez du temps, vous faites moins d’erreurs et vos clients peuvent vous joindre à toute heure. **Dans ce projet :** Domaine, outil de tunnel, e-mailing, WhatsApp, paiements et suivi sont branchés pour vous.","ratio":"equal"},{"id":"b5","type":"phases","heading":"Les étapes du projet","intro":"Voici, étape par étape, ce que nous faisons ensemble et ce que vous obtenez.","layout":"grid","showNum":true,"showDeliv":true,"items":[{"title":"Analyse stratégique","text":"On étudie votre client idéal, son parcours d’achat et vos concurrents.","extra":"Le parcours client défini"},{"title":"Offre marketing","text":"On clarifie votre offre : la promesse, le prix et les options de paiement.","extra":"Une offre claire, avec prix"},{"title":"Création de contenu","text":"On rédige les textes et on prépare les visuels, les vidéos et les e-mails.","extra":"Textes, visuels, vidéos et e-mails"},{"title":"Création des pages","text":"On construit chaque page : capture, vente, commande, paiement, remerciement et offres complémentaires.","extra":"Toutes les pages du tunnel"},{"title":"Configuration technique","text":"On branche le domaine, l’outil de tunnel, l’e-mailing, WhatsApp, les paiements et les pixels de suivi.","extra":"Un tunnel connecté et prêt"},{"title":"Automatisation","text":"Les e-mails et messages partent tout seuls, selon ce que fait chaque prospect.","extra":"Vos séquences automatiques"},{"title":"Tests et optimisation","text":"On teste tout comme un vrai client (achat, paiement, messages) et on corrige.","extra":"Un tunnel testé, sans erreur"},{"title":"Lancement","text":"Mise en ligne et premières actions pour attirer des visiteurs.","extra":"Votre tunnel en ligne"},{"title":"Suivi et optimisation","text":"On regarde les chiffres et on améliore les pages qui font perdre des clients.","extra":"Des améliorations appliquées"},{"title":"Reporting","text":"Bilan final avec les résultats obtenus.","extra":"Un tableau de bord et un rapport"}]},{"id":"b5l","type":"deliverables","heading":"Les livrables du projet","intro":"Tout ce que vous recevez à la fin du projet, et à quoi cela sert à votre entreprise.","roleLabel":"À quoi il sert","showNum":true,"showStep":true,"items":[{"title":"Le parcours client défini","text":"Garantit que le tunnel vise les bonnes personnes et suit leur façon réelle d’acheter.","extra":"Étape 1 · Analyse stratégique"},{"title":"Une offre claire, avec prix","text":"Rend votre proposition facile à comprendre et à accepter : plus d’offres claires, plus de ventes.","extra":"Étape 2 · Offre marketing"},{"title":"Textes, visuels, vidéos et e-mails","text":"Donne à votre tunnel des messages professionnels qui donnent confiance et poussent à l’action.","extra":"Étape 3 · Création de contenu"},{"title":"Toutes les pages du tunnel","text":"C’est ce que vos clients voient et utilisent : sans ces pages, aucune vente en ligne n’est possible.","extra":"Étape 4 · Création des pages"},{"title":"Un tunnel connecté et prêt","text":"Permet aux paiements, aux messages et au suivi de fonctionner réellement, sans intervention manuelle.","extra":"Étape 5 · Configuration technique"},{"title":"Vos séquences automatiques","text":"Vous fait gagner des heures : relances et messages partent seuls, même la nuit.","extra":"Étape 6 · Automatisation"},{"title":"Un tunnel testé, sans erreur","text":"Évite de perdre des clients à cause d’une erreur de paiement ou d’un lien cassé.","extra":"Étape 7 · Tests et optimisation"},{"title":"Votre tunnel en ligne","text":"Rend le tunnel visible : c’est le moment où il commence à rapporter.","extra":"Étape 8 · Lancement"},{"title":"Des améliorations appliquées","text":"Vous évite de perdre des clients au même endroit : chaque amélioration augmente vos ventes.","extra":"Étape 9 · Suivi et optimisation"},{"title":"Un tableau de bord et un rapport","text":"Vous permet de piloter vos ventes en un coup d’œil et de décider quoi améliorer.","extra":"Étape 10 · Reporting"}]},{"heading":"Conditions","body":"Paiement en tranches pour les projets au forfait (40 % / 30 % / 30 %). La durée annoncée est un maximum : le projet peut être livré plus tôt. Devis précis sous 48 h après le diagnostic.","type":"text","id":"b6"},{"heading":"Ce projet vous correspond ?","text":"Commandez-le en ligne, ou passez d’abord le diagnostic gratuit d’une heure si vous hésitez encore.","label":"Commander ce projet","target":"page:commander?p=2","type":"cta","id":"b7"}],"parent":"nos-projets"},{"id":"p_projet-3-community-management","slug":"projet-3-community-management","title":"Projet 3 · Community management et marketing de contenu","status":"publié","desc":"Développer une présence régulière et professionnelle sur les réseaux sociaux grâce à une stratégie éditoriale, des contenus adaptés et l’animation de la communauté. {{prix_fcfa_3}}.","blocks":[{"eyebrow":"Projet 03 · GSC · Être visible et vendre en ligne","title":"Community management et marketing de contenu","text":"Développer une présence régulière et professionnelle sur les réseaux sociaux grâce à une stratégie éditoriale, des contenus adaptés et l’animation de la communauté.\n\n{{prix_fcfa_3}} · forfait","cta1l":"Commander ce projet","cta1t":"page:commander?p=3","cta2l":"Diagnostic gratuit","cta2t":"page:contact","trail":false,"type":"hero","id":"b1"},{"heading":"","items":[{"title":"{{prix_3}}","text":"FCFA · "On crée et on suit des campagnes payantes bien ciblées.","extra":"Des campagnes en cours"},{"title":"Veille et innovation","text":"On surveille les tendances et vos concurrents pour vous proposer de nouvelles idées.","extra":"Des idées de contenus à tester"},{"title":"Influence et partenariat","text":"On repère des créateurs et des partenaires pour toucher de nouveaux clients.","extra":"Une liste de partenaires et des premiers contacts"},{"title":"Analyse et reporting","text":"On mesure ce qui marche : portée, interactions, clients venus des réseaux.","extra":"Un rapport de performance mensuel"},{"title":"Optimisation continue","text":"On garde ce qui marche et on change ce qui n’apporte rien.","extra":"Un plan d’amélioration pour le mois suivant"},{"title":"Clôture et bilan","text":"Bilan global de la période et recommandations pour la suite.","extra":"Un bilan final"}]},{"id":"b5l","type":"deliverables","heading":"Les livrables du projet","intro":"Tout ce que vous recevez à la fin du projet, et à quoi cela sert à votre entreprise.","roleLabel":"À quoi il sert","showNum":true,"showStep":true,"items":[{"title":"Votre stratégie réseaux sociaux","text":"Évite de publier au hasard : tout ce que vous faites sur les réseaux sert un objectif de vente.","extra":"Étape 1 · Analyse et stratégie"},{"title":"Un calendrier éditorial","text":"Vous garde régulier sans effort : un compte actif inspire confiance.","extra":"Étape 2 · Planification éditoriale"},{"title":"Vos publications prêtes","text":"Assure des publications de qualité, cohérentes avec votre image.","extra":"Étape 3 · Création de contenu"},{"title":"Des comptes actifs et réguliers","text":"Une présence régulière rend votre entreprise visible et crédible aux yeux des clients.","extra":"Étape 4 · Gestion des réseaux sociaux"},{"title":"Une communauté qui réagit","text":"Les clients qui reçoivent une réponse rapide achètent plus et reviennent.","extra":"Étape 5 · Animation de communauté"},{"title":"Des campagnes en c ommerciale et marketing, des supports et une présence digitale\n- Des rôles et procédures clairs, du personnel formé, des outils numériques et des automatisations","titleB":"Besoins couverts","bodyB":"- **Stratégie et plan** — **À quoi ça sert :** Définir où va votre entreprise et le chemin pour y arriver. **Pourquoi c’est important :** Sans cap, on dépense du temps et de l’argent sans avancer. **Dans ce projet :** Un diagnostic complet, puis un plan de travail daté pour la PME.\n- **Vente et marketing** — **À quoi ça sert :** Faire connaître votre offre et transformer les contacts en clients. **Pourquoi c’est important :** Sans clients, pas de chiffre d’affaires : c’est ce qui fait vivre l’entreprise. **Dans ce projet :** Vous organisez la prospection, les devis et le suivi des clients.\n- **Gestion et organisation** — **À quoi ça sert :** Organiser le travail, les documents, le temps et les procédures. **Pourquoi c’est important :** Évite les oublis, les retards et les pertes d’argent ; l’entreprise tourne même quand vous êtes absent. **Dans ce projet :** Administration, finances et outils de suivi sont mis en ordre.\n- **Équipe et leadership** — **À quoi ça sert :** Savoir diriger, motiver et déléguer. **Pourquoi c’est important :** Une équipe bien dirigée produit plus et vous libère du temps pour développer l’entreprise. **Dans ce projet :** Rôles, tâches et règles claires pour votre équipe.","ratio":"equal"},{"id":"b5","type":"phases","heading":"Les étapes du projet","intro":"Voici, étape par étape, ce que nous faisons ensemble et ce que vous obtenez.","layout":"grid","showNum":true,"showDeliv":true,"items":[{"title":"Diagnostic","text":"On fait le tour de votre PME : organisation, ventes, finances, équipe.","extra":"Un diagnostic complet"},{"title":"Planification","text":"On fixe les priorités et le calendrier des chantiers.","extra":"Un plan de travail daté"},{"title":"Gestion administrative","text":"On met en ordre vos documents, contrats, procédures et classement.","extra":"Une administration claire"},{"title":"Gestion financière","text":"On met en place le suivi de vos recettes, dépenses et trésorerie.","extra":"Des tableaux de suivi financier"},{"title":"Gestion commerciale","text":"On organise votre prospection, vos devis et le suivi de vos clients.","extra":"Un suivi commercial en place"},{"title":"Ressources humaines","text":"On clarifie les rôles, les tâches et le suivi de votre équipe.","extra":"Des fiches de poste et des règles simples"},{"title":"Digitalisation","text":"On installe les outils numériques qui vous font gagner du temps.","extra":"Des outils adaptés en service"},{"title":"Suivi et évaluation","text":"On vérifie que les changements fonctionnent vraiment.","extra":"Des indicateurs de suivi"},{"title":"Développement","text":"On identifie les pistes pour faire grandir la PME.","extra":"Un plan de développement"},{"title":"Reporting","text":"On présente les résultats obtenus, chiffres à l’appui.","extra":"Un rapport clair"},{"title":"Clôture","text":"Bilan final et conseils pour la suite.","extra":"Un bilan final"}]},{"id":"b5l","type":"deliverables","heading":"Les livrables du projet","intro":"Tout ce que vous recevez à la fin du projet, et à quoi cela sert à votre entreprise.","roleLabel":"À quoi il sert","showNum":true,"showStep":true,"items":[{"title":"Un diagnostic complet","text":"Vous montre ce qui bloque votre PME, pour agir sur les vrais problèmes.","extra":"Étape 1 · Diagnostic"},{"title":"Un plan de travail daté","text":"Évite de tout vouloir régler en même temps : chaque chantier a sa date.","extra":"Étape 2 · Planification"},{"title":"Une administration claire","text":"Retrouver un document en quelques secondes évite les pertes de temps et les litiges.","extra":"Étape 3 · Gestion administrative"},{"title":"Des tableaux de suivi financier","text":"Vous savez toujours où va votre argent et si vous pouvez payer vos charges.","extra":"Étape 4 · Gestion financière"},{"title":"Un suivi commercial en place","text":"Aucun client ni devis n’est oublié : plus de ventes et moins de pertes.","extra":"Étape 5 · Gestion commerciale"},{"title":"Des fiches de poste et des règles simples","text":"Chacun sait ce qu’il a à faire : moins de confusion et d’erreurs dans l’équipe.","extra":"Étape 6 · Ressources humaines"},{"title":"Des outils adaptés en service","text":"Vous gagnez du temps et vous réduisez les erreurs de saisie ou de suivi.","extra":"Étape 7 · Digitalisation"},{"title":"Des indicateurs de suivi","text":"Vous vérifiez que l’effort sert vraiment, avant de passer à la suite.","extra":"Étape 8 · Suivi et évaluation"},{"title":"Un plan de développement","text":"Vous savez où investir pour faire grandir la PME.","extra":"Étape 9 · Développement"},{"title":"Un rapport clair","text":"Vous pouvez montrer vos résultats à un partenaire, une banque ou un associé.","extra":"Étape 10 · Reporting"},{"title":"Un bilan final","text":"Vous laisse un point d’étape propre et les conseils pour la suite.","extra":"Étape 11 · Clôture"}]},{"heading":"Conditions","body":"Paiement en tranches pour les projets au forfait (40 % / 30 % / 30 %). La durée annoncée est un maximum : le projet peut être livré plus tôt. Devis précis sous 48 h après le diagnostic.","type":"text","id":"b6"},{"heading":"Ce projet vous correspond ?","text":"Commandez-le en ligne, ou passez d’abord le diagnostic gratuit d’une heure si vous hésitez encore.","label":"Commander ce projet","target":"page:commander?p=7","type":"cta","id":"b7"}],"parent":"nos-projets"},{"id":"p_projet-9-transformation-digitale","slug":"projet-9-transformation-digitale","title":"Projet 8 · Conseil en transformation digitale","status":"publié","desc":"Accompagner l’entreprise dans le choix et l’intégration d’outils numériques, l’amélioration de ses processus, l’automatisation et la transformation de ses activités commerciales et administratives. {{prix_fcfa_9}}.","blocks":[{"eyebrow":"Projet 08 · GSC · Transformer et accélérer","title":"Conseil en transformation digitale","text":"Accompagner l’entreprise dans le choix et l’intégration d’outils numériques, l’amélioration de ses processus, l’automatisation et la transformation de ses activités commerciales et administratives.\n\n{{prix_fcfa_8}} · forfait","cta1l":"Commander ce projet","cta1t":"page:commander?p=8","cta2l":"Diagnostic gratuit","cta2t":"page:contact","trail":false,"type":"hero","id":"b1"},{"heading":"","items":[{"title":"{{prix_8}}","text":"FCFA · forfait"},{"title":"6,0 mois","text":"durée maximale (179 jours)"},{"title":"12","text":"phases"},{"title":"4","text":"besoins couverts"}],"type":"stats","id":"b2"},{"id":"b3","type":"duo","heading":"","titleA":"Ce que vous obtenez","bodyA":"- Un diagnostic de maturité digitale et un audit de vos outils\n- Une stratégie digitale, des indicateurs et un budget\n- Des logiciels de gestion, des outils collaboratifs, un stockage en ligne et des sauvegardes\n- L’automatisation de vos tâches administratives et commerciales\n- Un site, un CRM, un tunnel de vente et des campagnes en ligne\n- Des équipes formées, des systèmes sécurisés et une culture d’innovation","titleB":"Besoins couverts","bodyB":"- **Stratégie et plan** — **À quoi ça sert :** Définir où va votre entreprise et le chemin pour y arriver. **Pourquoi c’est important :** Sans cap, on dépense du temps et de l’argent sans avancer. **Dans ce projet :** Une feuille de route digitale réaliste, dans le bon ordre.\n- **Vente et marketing** — **À quoi ça sert :** Faire connaître votre offre et transformer les contacts en clients. **Pourquoi c’est important :** Sans clients, pas de chiffre d’affaires : c’est ce qui fait vivre l’entreprise. **Dans ce projet :** Vos moyens de vendre et de communiquer passent en ligne.\n- **Outils digitaux** — **À quoi ça sert :** Faciliter et automatiser le travail : site, messages, suivi des clients. **Pourquoi c’est important :** Vous gagnez du temps, vous faites moins d’erreurs et vos clients peuvent vous joindre à toute heure. **Dans ce projet :** C’est le cœur du projet : outils, automatisations et cybersécurité.\n- **Gestion et organisation** — **À quoi ça sert :** Organiser le travail, les documents, le temps et les procédures. **Pourquoi c’est important :** Évite les oublis, les retards et les pertes d’argent ; l’entreprise tourne même quand vous êtes absent. **Dans ce projet :** Vos tâches répétitives sont automatisées et mieux organisées.","ratio":"equal"},{"id":"b5","type":"phases","heading":"Les étapes du projet","intro":"Voici, étape par étape, ce que nous faisons ensemble et ce que vous obtenez.","layout":"grid","showNum":true,"showDeliv":true,"items":[{"title":"Diagnostic digital","text":"On regarde comment vous travaillez aujourd’hui et ce que le numérique peut améliorer.","extra":"Un diagnostic digital"},{"title":"Planification stratégique","text":"On choisit les chantiers dans le bon ordre, avec un calendrier réaliste.","extra":"Une feuille de route digitale"},{"title":"Infrastructure et outils","text":"On choisit et installe les outils (messagerie, stockage, gestion) adaptés à votre taille.","extra":"Un équipement numérique prêt"},{"title":"Automatisation","text":"On automatise les tâches répétitives pour gagner du temps.","extra":"Des tâches automatisées"},{"title":"Digitalisation commerciale","text":"On met en ligne vos moyens de vendre et de suivre vos clients.","extra":"Une vente digitalisée"},{"title":"Communication digitale","text":"On renforce votre présence en ligne : site, réseaux, e-mails.","extra":"Une communication numérique en place"},{"title":"Formation et conduite du changement","text":"On forme votre équipe et on l’accompagne pour adopter les nouveaux outils.","extra":"Une équipe formée et à l’aise"},{"title":"Cybersécurité","text":"On protège vos données : mots de passe, sauvegardes, accès.","extra":"Des règles de sécurité appliquées"},{"title":"Suivi et optimisation","text":"On vérifie l’usage réel des outils et on corrige.","extra":"Des ajustements appliqués"},{"title":"Reporting","text":"On mesure le temps gagné et les résultats obtenus.","extra":"Un rapport de résultats"},{"title":"Innovation et croissance","text":"On repère les nouvelles idées numériques pour grandir.","extra":"Des pistes d’innovation"},{"title":"Clôture et pérennisation","text":"Bilan final et organisation pour que tout continue de fonctionner sans nous.","extra":"Un plan pour la suite"}]},{"id":"b5l","type":"deliverables","heading":"Les livrables du projet","intro":"Tout ce que vous recevez à la fin du projet, et à quoi cela sert à votre entreprise.","roleLabel":"À quoi il sert","showNum":true,"showStep":true,"items":[{"title":"Un diagnostic digital","text":"Vous montre ce qui est utile et ce qui ne l’est pas : on ne digitalise pas au hasard.","extra":"Étape 1 · Diagnostic digital"},{"title":"Une feuille de route digitale","text":"Évite les dépenses inutiles : vous avancez dans le bon ordre, avec un budget maîtrisé.","extra":"Étape 2 · Planification stratégique"},{"title":"Un équipement numérique prêt","text":"Des outils adaptés vous font gagner du temps sans compliquer le travail de l’équipe.","extra":"Étape 3 · Infrastructure et outils"},{"title":"Des tâches automatisées","text":"Vos équipes arrêtent de refaire les mêmes tâches à la main : moins d’erreurs, plus de temps pour vendre.","extra":"Étape 4 · Automatisation"},{"title":"Une vente digitalisée","text":"Vos clients peuvent vous contacter et acheter en ligne : vous ne dépendez plus d’un seul canal.","extra":"Étape 5 · Digitalisation commerciale"},{"title":"Une communication numérique en place","text":"Vous êtes visible et crédible en ligne : plus de clients vous trouvent.","extra":"Étape 6 · Communication digitale"},{"title":"Une équipe formée et à l’aise","text":"Un outil que personne n’utilise ne sert à rien : votre équipe adopte les nouveaux outils avec confiance.","extra":"Étape 7 · Formation et conduite du changement"},{"title":"Des règles de sécurité appliquées","text":"Protège votre entreprise des pertes de données, des piratages et des arnaques.","extra":"Étape 8 · Cybersécurité"},{"title":"Des ajustements appliqués","text":"Évite que les outils restent sous-utilisés : on corrige ce qui gêne.","extra":"Étape 9 · Suivi et optimisation"},{"title":"Un rapport de résultats","text":"Prouve que le numérique rapporte : temps gagné, ventes, économies.","extra":"Étape 10 · Reporting"},{"title":"Des pistes d’innovation","text":"Vous gardez une longueur d’avance sur les concurrents qui n’innovent pas.","extra":"Étape 11 · Innovation et croissance"},{"title":"Un plan pour la suite","text":"Les outils continuent d’être utilisés après notre départ : l’entreprise reste autonome.","extra":"Étape 12 · Clôture et pérennisation"}]},{"heading":"Conditions","body":"Paiement en tranches pour les projets au forfait (40 % / 30 % / 30 %). La durée annoncée est un maximum : le projet peut être livré plus tôt. Devis précis sous 48 h après le diagnostic.","type":"text","id":"b6"},{"heading":"Ce projet vous correspond ?","text":"Commandez-le en ligne, ou passez d’abord le diagnostic gratuit d’une heure si vous hésitez encore.","label":"Commander ce projet","target":"page:commander?p=8","type":"cta","id":"b7"}],"parent":"nos-projets"},{"id":"p_projet-10-business-accelerator-premium","slug":"projet-10-business-accelerator-premium","title":"Projet 9 · Business Accelerator Premium","status":"publié","desc":"Un accompagnement renforcé pour accélérer une entreprise à fort potentiel, incluant stratégie de croissance, organisation, gestion comptable et recherche de marchés publics selon les besoins convenus. {{prix_fcfa_10}}.","blocks":[{"eyebrow":"Projet 09 · GSC · Transformer et accélérer","title":"Business Accelerator Premium","text":"Un accompagnement renforcé pour accélérer une entreprise à fort potentiel, incluant stratégie de croissance, organisation, gestion comptable et recherche de marchés publics selon les besoins convenus.\n\n{{prix_fcfa_9}} · forfait","cta1l":"Commander ce projet","cta1t":"page:commander?p=9","cta2l":"Diagnostic gratuit","cta2t":"page:contact","trail":false,"type":"hero","id":"b1"},{"heading":"","items":[{"title":"{{prix_9}}","text":"FCFA · forfait"},{"title":"5,9 mois","text":"durée maximale (178 jours)"},{"title":"13","text":"phases"},{"title":"5","text":"besoins couverts"}],"type":"stats","id":"b2"},{"id":"b3","type":"duo","heading":"","titleA":"Ce que vous obtenez","bodyA":"- Un audit business complet et un plan d’accélération\n- Une marque et une offre premium, avec des packages de services\n- Un tunnel de vente premium, des campagnes et une automatisation marketing\n- Une équipe commerciale formée, un CRM et des scripts de vente\n- Des prévisions financières, une trésorerie optimisée et des dossiers d’investissement\n- Un coaching personnalisé, des partenariats et un plan d’expansion","titleB":"Besoins couverts","bodyB":"- **Stratégie et plan** — **À quoi ça sert :** Définir où va votre entreprise et le chemin pour y arriver. **Pourquoi c’est important :** Sans cap, on dépense du temps et de l’argent sans avancer. **Dans ce projet :** Un diagnostic en profondeur et un plan stratégique ambitieux.\n- **Vente et marketing** — **À quoi ça sert :** Faire connaître votre offre et transformer les contacts en clients. **Pourquoi c’est important :** Sans clients, pas de chiffre d’affaires : c’est ce qui fait vivre l’entreprise. **Dans ce projet :** Marque, acquisition de clients et méthode de vente travaillées ensemble.\n- **Gestion et organisation** — **À quoi ça sert :** Organiser le travail, les documents, le temps et les procédures. **Pourquoi c’est important :** Évite les oublis, les retards et les pertes d’argent ; l’entreprise tourne même quand vous êtes absent. **Dans ce projet :** Des systèmes et procédures pour que l’entreprise tourne sans vous.\n- **Financement** — **À quoi ça sert :** Gérer l’argent de l’entreprise et trouver les moyens de financer sa croissance. **Pourquoi c’est important :** Le manque de trésorerie est une cause fréquente d’échec : mieux vaut s’y préparer avant d’en avoir besoin. **Dans ce projet :** Pilotage financier et préparation du financement de la croissance.\n- **Équipe et leadership** — **À quoi ça sert :** Savoir diriger, motiver et déléguer. **Pourquoi c’est important :** Une équipe bien dirigée produit plus et vous libère du temps pour développer l’entreprise. **Dans ce projet :** Coaching rapproché pour diriger, déléguer et décider avec assurance.","ratio":"equal"},{"id":"b5","type":"phases","heading":"Les étapes du projet","intro":"Voici, étape par étape, ce que nous faisons ensemble et ce que vous obtenez.","layout":"grid","showNum":true,"showDeliv":true,"items":[{"title":"Sélection et intégration","text":"On s’assure que le programme vous convient et on prépare votre démarrage.","extra":"Un dossier de départ validé"},{"title":"Diagnostic stratégique","text":"On analyse en profondeur votre entreprise, votre marché et vos priorités.","extra":"Un diagnostic stratégique"},{"title":"Planification stratégique","text":"On fixe des objectifs ambitieux et le plan détaillé pour les atteindre.","extra":"Un plan stratégique complet"},{"title":"Branding et positionnement","text":"On travaille votre image, votre message et ce qui vous distingue.","extra":"Une marque claire et différenciante"},{"title":"Marketing et acquisition","text":"On met en place les moyens pour attirer régulièrement de nouveaux clients.","extra":"Un système d’acquisition de clients"},{"title":"Vente et conversion","text":"On améliore votre façon de vendre pour transformer plus de prospects en clients.","extra":"Un processus de vente éprouvé"},{"title":"Finance et croissance","text":"On pilote vos chiffres et on prépare le financement de la croissance.","extra":"Un pilotage financier en place"},{"title":"Digitalisation et systèmes","text":"On installe les outils et les procédures pour que l’entreprise tourne sans vous.","extra":"Des systèmes qui fonctionnent"},{"title":"Coaching et mentoring","text":"Des séances rapprochées avec votre coach, sur vos décisions importantes.","extra":"Un accompagnement sur mesure"},{"title":"Partenariats et réseau","text":"On construit des alliances utiles pour accéder à de nouveaux clients et marchés.","extra":"Un réseau de partenaires actif"},{"title":"Suivi et optimisation","text":"On suit vos résultats de près et on ajuste rapidement.","extra":"Des corrections appliquées"},{"title":"Reporting et évaluation","text":"On mesure ce qui a été accompli par rapport aux objectifs.","extra":"Un rapport d’évaluation"},{"title":"Clôture et scaling","text":"Bilan final et plan pour passer à l’échelle supérieure.","extra":"Un plan de changement d’échelle"}]},{"id":"b5l","type":"deliverables","heading":"Les livrables et prestations possibles","intro":"Tout ce que vous recevez à la fin du projet, et à quoi cela sert à votre entreprise.","roleLabel":"À quoi il sert","showNum":true,"showStep":true,"items":[{"title":"Un dossier de départ validé","text":"Garantit que le programme est adapté à votre entreprise et que vous démarrez avec les bons éléments.","extra":"Étape 1 · Sélection et intégration"},{"title":"Un diagnostic stratégique","text":"Vous donne une vision claire et chiffrée de votre entreprise : base de toutes les grandes décisions.","extra":"Étape 2 · Diagnostic stratégique"},{"title":"Un plan stratégique complet","text":"Transforme l’ambition en actions précises, avec des dates et des responsables.","extra":"Étape 3 · Planification stratégique"},{"title":"Une marque claire et différenciante","text":"Une marque forte permet de vendre plus cher et de se démarquer des concurrents.","extra":"Étape 4 · Branding et positionnement"},{"title":"Un système d’acquisition de clients","text":"Vous ne dépendez plus du hasard pour trouver des clients : l’arrivée de nouveaux clients devient régulière.","extra":"Étape 5 · Marketing et acquisition"},{"title":"Un processus de vente éprouvé","text":"Plus de prospects deviennent des clients sans dépenser plus en publicité.","extra":"Étape 6 · Vente et conversion"},{"title":"Un pilotage financier en place","text":"Vous voyez où l’argent entre et sort, et vous savez combien investir pour grandir sans risque.","extra":"Étape 7 · Finance et croissance"},{"title":"Des systèmes qui fonctionnent","text":"L’entreprise peut fonctionner et grandir même quand vous n’êtes pas là.","extra":"Étape 8 · Digitalisation et systèmes"},{"title":"Un accompagnement sur mesure","text":"Vous prenez les décisions importantes avec un regard expert, donc avec moins de risques d’erreur.","extra":"Étape 9 · Coaching et mentoring"},{"title":"Un réseau de partenaires actif","text":"Les bons partenaires vous apportent des clients et des marchés que vous ne pourriez pas atteindre seul.","extra":"Étape 10 · Partenariats et réseau"},{"title":"Des corrections appliquées","text":"Vous corrigez vite et vous évitez de perdre du temps ou de l’argent sur ce qui ne marche pas.","extra":"Étape 11 · Suivi et optimisation"},{"title":"Un rapport d’évaluation","text":"Prouve ce que le programme a apporté, et montre ce qu’il reste à faire.","extra":"Étape 12 · Reporting et évaluation"},{"title":"Un plan de changement d’échelle","text":"Vous permet de grandir davantage avec une organisation solide, sans désordre.","extra":"Étape 13 · Clôture et scaling"},{"title":"Gestion comptable","text":"Organisation et suivi des éléments comptables convenus avec l’entreprise et ses prestataires habilités."},{"title":"Recherche de marchés publics","text":"Veille et repérage d’opportunités de marchés publics pertinentes pour l’activité."}]},{"heading":"Conditions","body":"Les prestations de gestion comptable et de recherche de marchés publics sont intégrées au Business Accelerator Premium selon le périmètre convenu. Les frais ou services de tiers sont précisés avant engagement.","type":"text","id":"b6"},{"heading":"Ce projet vous correspond ?","text":"Commandez-le en ligne, ou passez d’abord le diagnostic gratuit d’une heure si vous hésitez encore.","label":"Commander ce projet","target":"page:commander?p=9","type":"cta","id":"b7"}],"parent":"nos-projets"},{"id":"p_tarifs-et-conditions","slug":"tarifs-et-conditions","title":"Tarifs et conditions","status":"publié","desc":"Prix affichés, paiement en tranches 40/30/30, remises et conditions.","blocks":[{"heading":"Payer simplement, en tranches","body":"Nos prix sont affichés avant le diagnostic. Ils tiennent compte du travail de l’équipe et des repères du marché au Sénégal et en Afrique de l’Ouest. Chaque projet a un devis précis, remis sous 48 h après le diagnostic.","type":"text","id":"b1"},{"id":"b2","type":"text","heading":"Les {{nb_projets}} projets","body":"Prix en FCFA. Fixes pour toute la durée du projet, sauf le Community management, facturé chaque mois.\nChoisissez votre projet et commandez-le en quelques clics."},{"id":"b2p","type":"projcards","heading":"Les {{nb_projets}} offres GSC","intro":"","layout":"mini","cols":"auto","group":false,"corners":"round","bar":"top","shadow":"soft","align":"left","cbg":"","showNum":true,"showBadge":true,"showTag":true,"showBullets":true,"showFor":true,"showPrice":true,"showDur":true,"showBtn":true,"btn":"Commander","showDetail":true,"note":"Un doute ? [Passez d’abord le diagnostic gratuit d’une heure](page:contact) : il indique le projet qui vous convient. Devis précis sous 48 h, paiement possible en 3 tranches (40 % / 30 % / 30 %).","items":[{"title":"1","text":"Créez et formalisez votre entreprise","extra":"Démarches administratives ; documents administratifs ; business plan simplifié ou complet ; plan de lancement ; > Porteurs de projet et entrepreneurs qui souhaitent formaliser leur activité."},{"title":"2","text":"Attirez des prospects et convertissez-les en clients","extra":"Offre commerciale et parcours de conversion ; tunnels de vente et points de contact ; suivi des prospects et des ventes ; > Entreprises qui veulent structurer leur acquisition client."},{"title":"3","text":"Développez votre présence sur les réseaux sociaux","extra":"Stratégie éditoriale ; calendrier de contenu ; création et publication de contenus ; animation de communauté ; # Mensuel ; > Entreprises qui veulent une présence régulière et professionnelle."},{"title":"4","text":"Disposez d’un site web professionnel","extra":"Structure et contenus du site ; conception adaptée aux mobiles ; mise en ligne et prise en main ; > Entreprises qui veulent présenter leur activité et générer des demandes."},{"title":"5","text":"Renforcez votre leadership et votre management","extra":"Leadership et communication ; organisation et gestion d’équipe ; pratiques managériales ; prise en compte des priorités de structuration d’une PME ; > Dirigeants et managers."},{"title":"6","text":"Structurez votre stratégie de croissance","extra":"Diagnostic stratégique ; priorités commerciales ; plan de croissance et indicateurs ; intégration des enjeux de performance et d’organisation ; > Entreprises déjà en activité."},{"title":"7","text":"Améliorez la performance de votre PME","extra":"Diagnostic organisationnel ; administration et finances ; ventes, équipes et outils ; application de la Méthode GSC ; > TPE et PME qui souhaitent structurer leur activité."},{"title":"8","text":"Accélérez votre transformation digitale","extra":"Diagnostic digital ; choix et intégration d’outils ; amélioration des processus ; automatisation des tâches ; > Entreprises qui souhaitent accélérer leur transition numérique."},{"title":"9","text":"Accélérez votre entreprise avec un accompagnement premium","extra":"Stratégie d’accélération ; organisation et développement commercial ; gestion comptable selon le périmètre convenu ; recherche de marchés publics ; # Sur sélection ; > Entreprises à fort potentiel."}]},{"heading":"Paiement en tranches (projets au forfait)","body":"","type":"text","id":"b3"},{"code":"\u003col class=\"pay-grid\">\u003cli class=\"pay-card\">\u003cspan class=\ ":"Planifier les projets et les tâches, gérer les formations en présentiel et en ligne"},{"title":"Tableau de bord","text":"Suivre prospects, conversion, chiffre d’affaires, satisfaction et projets en cours"}],"type":"cards","id":"b2"},{"heading":"Découvrez-les en action","text":"Le diagnostic gratuit d’une heure est le point d’entrée dans nos outils.","label":"Réserver mon diagnostic gratuit","target":"page:contact","type":"cta","id":"b3"}]},{"id":"p_contact","slug":"contact","title":"Contact","status":"publié","desc":"Réservez votre diagnostic gratuit : téléphone, WhatsApp, e-mail, Calendly.","blocks":[{"heading":"Parlons de votre projet","text":"Le premier pas est gratuit : un diagnostic d’une heure pour savoir où en est votre entreprise et quel projet lui convient. Réservez sur Calendly ou écrivez-nous sur WhatsApp : nous revenons vers vous avec un devis sous 48 h.","form":true,"type":"contact","id":"b1"}]},{"id":"p-mentions","slug":"mentions-legales","title":"Mentions légales","status":"publié","legal":true,"desc":"Informations légales sur l’éditeur du site GSC Business Center.","blocks":[{"id":"b1","type":"text","heading":"Mentions légales","body":"## Éditeur du site\n{{full}} ({{name}}) — Thiès, Sénégal.\nTéléphone : {{phone}}\nE-mail : {{email}}\nForme juridique, numéro d’immatriculation (NINEA / RCCM) : [à compléter]\nResponsable de la publication : [à compléter]\n\n## Hébergement\nHébergeur : [à compléter]\n\n## Propriété intellectuelle\nLes textes, images, logos et documents de ce site sont la propriété de {{name}}, sauf mention contraire. Toute reproduction sans autorisation est interdite.\n\n## Responsabilité\nLes informations publiées ont une valeur indicative. {{name}} s’efforce de les tenir à jour mais ne peut garantir qu’elles soient exemptes d’erreur."}]},{"id":"p-confidentialite","slug":"confidentialite","title":"Politique de confidentialité","status":"publié","legal":true,"desc":"Comment GSC Business Center traite vos données personnelles.","blocks":[{"id":"b1","type":"text","heading":"Politique de confidentialité","body":"## Données que nous recueillons\nLorsque vous nous contactez, nous recevons les informations que vous nous transmettez : nom, téléphone ou e-mail, message.\n\n## Utilisation\nCes données servent uniquement à répondre à votre demande et à vous proposer un accompagnement. Elles ne sont pas vendues.\n\n## Conservation\nDurée de conservation : [à compléter]\n\n## Vos droits\nVous pouvez demander l’accès, la correction ou la suppression de vos données en écrivant à {{email}}.\n\n## Statistiques et cookies\nCe site ne dépose pas de cookie publicitaire. Si une mesure d’audience est activée, elle est anonyme. [à compléter selon l’outil choisi]\n\n## Réglementation applicable\n[à compléter après vérification avec un juriste : loi sénégalaise sur la protection des données personnelles]"}]}],"posts":[{"id":"a1","slug":"clarifier-son-projet-en-90-minutes","title":"Clarifier son projet en 90 minutes","date":"2026-10-05","cat":"Étape 1","status":"publié","excerpt":"Avant de lancer quoi que ce soit, une idée doit devenir un problème clairement formulé. Voici comment nous y arrivons en un entretien.","body":"Une idée floue coûte cher : elle fait perdre du temps à toutes les étapes suivantes. L’étape 1 de la méthode GSC sert à la transformer en projet clair.\n## Avant le rendez-vous\nNous envoyons un questionnaire 48 h à l’avance. Il demande :\n- l’idée de projet en une phrase\n- le problème qu’elle résout\n- la cible visée\n- votre motivation\n- vos contraintes de budget et de temps\n## Pendant l’entretien\nL’entretien de découverte dure 60 à 90 minutes. Nous creusons le pourquoi avec quelques questions :\n- Quel problème précis résolvez-vous ?\n- Pour qui, exactement ?\n- Pourquoi ce problème n’est-il pas déjà résolu ?\n- Que se passe-t-il pour le client si rien ne change ?\n## Après l’entretien\nNous rédigeons une fiche d’une page : mission, cible, problème, offre de valeur. Vous la validez avant de passer à l’étape suivante.","author":""},{"id":"a2","slug":"sept-questions-pour-valider-votre-marche","title":"Sept questions pour valider votre marché","date":"2026-10-08","cat":"Étape 2","status":"publié","excerpt":"Cinq à dix conversations avec votre cible valent mieux qu’un mois d’hypothèses. Voici les questions à poser.","body":"Valider le marché, c’est vérifier auprès de vraies personnes que le besoin existe. Nous recommandons 5 à 10 entretiens, ou un mini-sondage, auprès de la cible identifiée.\n## Les sept questions\n- Rencontrez-vous actuellement ce problème ?\n- Comment le gérez-vous aujourd’hui ?\n- Qu’est-ce qui vous frustre le plus dans la solution actuelle ?\n- Si une solution comme la vôtre existait, seriez-vous intéressé(e) ?\n- Combien seriez-vous prêt(e) à payer ?\n- Qu’est-ce qui vous ferait hésiter ?\n- Recommanderiez-vous cette solution à quelqu’un d’autre ?\n## Que faire des réponses\nRassemblez-les dans une grille d’étude de marché : demande, concurrence, prix, rentabilité. Comparez avec l’analyse de vos concurrents, puis ajustez votre hypothèse de rentabilité.","author":""},{"id":"a3","slug":"les-quatre-temps-d-un-entretien-de-vente","title":"Les quatre temps d’un entretien de vente","date":"2026-10-12","cat":"Étape 6","status":"publié","excerpt":"Découverte, présentation, objections, conclusion : une trame simple pour que l’entretien mène naturellement à une proposition adaptée.","body":"Un entretien de vente structuré aboutit plus naturellement à une proposition adaptée. Notre trame suit quatre temps.\n## 1. Découvrir le besoin\nQuel est votre principal défi ? Qu’avez-vous déjà essayé ? Qu’est-ce qui vous ferait dire que l’accompagnement est réussi ?\n## 2. Présenter l’offre adaptée\nReformulez le besoin exprimé, puis reliez l’offre directement à ce besoin.\n## 3. Traiter les objections\nÉcoutez sans interrompre, reformulez pour vérifier que vous avez compris, puis répondez avec un argument ou un exemple concret. Quatre objections reviennent souvent :\n- « C’est trop cher » : mettez en avant le retour sur investissement et le coût de l’inaction.\n- « Je n’ai pas le temps » : montrez que l’accompagnement fait gagner du temps à moyen terme.\n- « Je veux réfléchir » : identifiez le vrai frein derrière cette phrase.\n- « Je ne suis pas sûr que ça marche pour moi » : partagez un résultat concret similaire.\n## 4. Conclure\nProposez une prochaine étape claire, par exemple un devis ou une date de signature, et fixez une date de relance si besoin.","author":""}],"siteId":"cabinet","rev":"20261022-accueil-presentation-v1","media":[{"id":"jjbh0s","name":"WhatsApp Image 2026-10-22 at 23.29.29","src":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAUAAtADASIAAhEBAxEB/8QAHQAAAQUBAQEBAAAAAAAAAAAAAgABAwQFBgcICf/EAF8QAAEDAgMFBQQGBgYHBQUBEQIAAQMEEgURIgYTITEyQUJRUmEHFGJxI3KBkZKxFTNTgqHBCCRDc6LRFiU0VGOy4ReDk9LwJkRkwvE1RVWElOIYw9M2Rkd0laSztOP/xAAaAQEBAQEBAQEAAAAAAAAAAAAAAQIDBAUG/8QAKREBAQEBAAICAgICAgIDAQAAAAERAgMSITEEQRNRIjIFFDNhFUJxI//aAAwDAQACEQMRAD8A7xmTimFPkvmOsPanSSRdJOknyRTipQHiohUoEgnAGuYh6l0eDY0dOYxl0rmmPSrMEu7Jcu+db4szK9DHFoSBuKycWr3lB7VlU9c+TCSapmuWL331c6qzmT6ZlVnc9zqiauznc6pyrrzrFQEhREoyW0Ckn4JEjKNJGhQJ
